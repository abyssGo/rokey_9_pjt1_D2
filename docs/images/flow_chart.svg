<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2300" viewBox="0 0 1000 1150" role="img" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<title>PreWash-Cell 플로우 차트</title>
<defs><pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e2e8f0" stroke-width=".8"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker></defs>
<rect width="1000" height="1150" fill="#fff"/><rect width="1000" height="1150" fill="url(#g)"/>
<text x="500.0" y="30" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">PreWash-Cell 플로우 차트 — 시작 버튼 한 번, 용기 1개의 흐름</text>
<text x="500.0" y="50" font-size="11" fill="#64748b" text-anchor="middle">화면에서 시작을 누르면 그릇 2개 → 컵 2개를 차례로 돈다 · 왼쪽 = 정상 흐름 · 오른쪽 = 어느 단계에서든 걸리는 예외 처리</text>
<rect x="140.0" y="77.0" width="220" height="36" rx="18.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="250" y="100" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">시작 — 화면 버튼 1번</text>
<path d="M250 113 L250 143" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M250 143.0 L375.0 175 L250 207.0 L125.0 175 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="250" y="174" font-size="12" fill="#713f12" text-anchor="middle" font-weight="700">반납 구역에 용기가 있나?</text>
<text x="250" y="189" font-size="10" fill="#713f12" text-anchor="middle">슬롯 1 → 비면 슬롯 2</text>
<path d="M250 207 L250 238" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="256.4" y="215" width="19.2" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="266" y="227" font-size="10" fill="#374151" text-anchor="middle">있다</text>
<path d="M375 175 L580 175 L580 965 L365 965" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="440.2" y="152" width="69.6" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="475" y="164" font-size="10" fill="#374151" text-anchor="middle">없다 → 구역 건너뜀</text>
<rect x="100.0" y="238.0" width="300" height="54" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250" y="261.0" font-size="13" fill="#0c4a6e" text-anchor="middle" font-weight="700">① 집기</text>
<text x="250" y="277.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">고정 슬롯에서 집는다 · 파지 폭으로 &quot;집었나&quot; 확인</text>
<path d="M250 292 L250 318" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="100.0" y="318.0" width="300" height="54" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250" y="341.0" font-size="13" fill="#0c4a6e" text-anchor="middle" font-weight="700">② 무게</text>
<text x="250" y="357.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">HOME 경유 → 무게 자세 · 8 s 정지 · 30회 읽은 중앙값</text>
<path d="M250 372 L250 410" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M250 410.0 L365.0 440 L250 470.0 L135.0 440 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="250" y="444" font-size="12" fill="#713f12" text-anchor="middle" font-weight="700">잔반 &gt; 50 g ?</text>
<path d="M250 470 L250 513" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="255.60000000000002" y="478" width="24.799999999999997" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="268" y="490" font-size="10" fill="#374151" text-anchor="middle">아니오</text>
<rect x="405.0" y="413.0" width="150" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="480" y="436.0" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="700">잔반 털기</text>
<text x="480" y="452.0" font-size="10.5" fill="#7c2d12" text-anchor="middle">잔반통 위에서 턴다 · 최대 2회</text>
<path d="M365 440 L405.0 440" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="378.2" y="422" width="13.6" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="385.0" y="434" font-size="10" fill="#374151" text-anchor="middle">예</text>
<path d="M480 413 L480 345 L400.0 345" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="462.0" y="323" width="36.0" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="480" y="335" font-size="10" fill="#374151" text-anchor="middle">다시 잰다</text>
<rect x="100.0" y="513.0" width="300" height="54" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250" y="536.0" font-size="13" fill="#0c4a6e" text-anchor="middle" font-weight="700">③ 안착</text>
<text x="250" y="552.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">스펀지 홈에 곧게 내려놓는다 (접근점 → Z 만 직선)</text>
<path d="M250 567 L250 585" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="100.0" y="585.0" width="300" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250" y="607.0" font-size="13" fill="#0c4a6e" text-anchor="middle" font-weight="700">④ 닦기</text>
<text x="250" y="623.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">툴 집기 (그릇 = 수세미 · 컵 = 솔) → 세제 담금</text>
<text x="250" y="637.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">그릇: 바닥 나선 → 벽면 1.5 N 힘 제어</text>
<text x="250" y="651.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">컵: 위아래 · 손목 주기 운동 → 툴 반납</text>
<path d="M250 665 L250 688" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="100.0" y="688.0" width="300" height="54" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250" y="711.0" font-size="13" fill="#0c4a6e" text-anchor="middle" font-weight="700">⑤ 헹굼</text>
<text x="250" y="727.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">다시 집기 (컵은 옆면) → 헹굼 2회 담금 → 물 털기</text>
<path d="M250 742 L250 773" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="100.0" y="773.0" width="300" height="54" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="250" y="796.0" font-size="13" fill="#0c4a6e" text-anchor="middle" font-weight="700">⑥ 적재</text>
<text x="250" y="812.0" font-size="10.5" fill="#0c4a6e" text-anchor="middle">팔레트 칸에 꽂는다 (컵은 뒤집어서) → HOME</text>
<path d="M250 827 L250 856" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="100.0" y="856.0" width="300" height="48" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250" y="876.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">기록</text>
<text x="250" y="892.0" font-size="10.5" fill="#1e293b" text-anchor="middle">용기 1개 = 이벤트 1건 · records.csv 1줄 · 화면 DB</text>
<path d="M250 904 L250 935" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M250 935.0 L365.0 965 L250 995.0 L135.0 965 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="250" y="969" font-size="12" fill="#713f12" text-anchor="middle" font-weight="700">남은 용기 · 구역?</text>
<path d="M250 995 L250 1042" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="258.4" y="1003" width="19.2" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="268" y="1015" font-size="10" fill="#374151" text-anchor="middle">없다</text>
<path d="M135 965 L85 965 L85 175 L125 175" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="53.0" y="941" width="64.0" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="85" y="953" font-size="10" fill="#374151" text-anchor="middle">있다 → 다음 용기</text>
<rect x="140.0" y="1042.0" width="220" height="36" rx="18.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="250" y="1065" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">완료 — DONE</text>
<rect x="605.0" y="80" width="390" height="1030" rx="14" fill="#fff7f7" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="800" y="105" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700">어느 단계에서든 — 예외 처리</text>
<text x="800" y="123" font-size="10" fill="#7f1d1d" text-anchor="middle">원칙: 멈춤은 그 자리에서 · 격리는 툴 반납 뒤 · 위치를 모르면 움직이지 않는다</text>
<rect x="620.0" y="157.0" width="360" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="800" y="180.0" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="700">멈춤 (PAUSED) — 그 자리에서 선다</text>
<text x="800" y="196.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">운영자 일시 정지 (이동 도중 · 닦기 동작은 끝난 뒤)</text>
<text x="800" y="210.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">케이블 이상 — 무게 떨림 &gt; 80 g</text>
<text x="800" y="224.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">툴 놓침 · 툴 집기 실패 (파지 폭이 툴 폭이 아님)</text>
<text x="800" y="238.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">로봇 오류 — 보호정지 · 이동 미완</text>
<path d="M800 253 L800 288" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="620.0" y="288.0" width="360" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="800" y="315.0" font-size="12.5" fill="#7f1d1d" text-anchor="middle" font-weight="700">재개 — 화면 버튼 · 팔 밀기(15 N)</text>
<text x="800" y="331.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">밀기는 케이블 · 툴 놓침 · 툴 집기 실패 멈춤에서만</text>
<text x="800" y="345.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">밀었으면 손 뗄 시간 1.5 s → 보호정지 복구</text>
<text x="800" y="359.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">일시 정지 → 하던 동작부터 이어서 (왼쪽 흐름으로 복귀)</text>
<text x="800" y="373.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">툴 놓침 → ④ 툴 집기부터 · 케이블 → ② 무게부터 다시</text>
<path d="M800 392 L800 444" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="734.4" y="406" width="131.2" height="15" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="800" y="418" font-size="10" fill="#374151" text-anchor="middle">멈춤 중에 중단 (로봇 오류에서는 거부)</text>
<rect x="620.0" y="444.0" width="360" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="800" y="469.0" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="700">중단 (abort) — 이 용기는 접는다</text>
<text x="800" y="485.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">곧게 위로 → HOME → 툴 반납 → 용기 격리 → 기록 → 다음 용기</text>
<text x="800" y="499.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">이력에는 &quot;관리자 격리&quot; 로 남는다</text>
<path d="M800 516 L800 574" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="620.0" y="574.0" width="360" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="800" y="599.0" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="700">자동 격리 — 사람 없이</text>
<text x="800" y="615.0" font-size="10.5" fill="#7c2d12" text-anchor="middle">두 번 털어도 잔반이 남음 (곧게 위로 → HOME → 격리 구역)</text>
<text x="800" y="629.0" font-size="10.5" fill="#7c2d12" text-anchor="middle">닦기 힘 · 시간 상한을 넘어 한 번 더 닦아도 실패 → 기록 → 다음 용기</text>
<rect x="620.0" y="702.0" width="360" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="800" y="725.0" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="700">로봇 오류 — 2단 신호</text>
<text x="800" y="741.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">그 자리에서 멈춤 (위로 한 번 시도 · 위치를 모르면 그대로)</text>
<text x="800" y="755.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">신호 1 (밀기 · 재개): 그리퍼만 열어 쥔 것을 사람에게 넘긴다</text>
<text x="800" y="769.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">신호 2 (화면 재개만): 곧게 위로 → HOME → 오류 기록 → 다음 용기</text>
<text x="800" y="783.0" font-size="10.5" fill="#7f1d1d" text-anchor="middle">급할 때는 펜던트 E-Stop · 실기 시험에서는 제외(자동 시험)</text>
<rect x="620.0" y="852.0" width="360" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800" y="875.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">함께 도는 것</text>
<text x="800" y="891.0" font-size="10.5" fill="#1e293b" text-anchor="middle">/flow/state 1초에 2번 — 단계 · 진행 수 · 멈춤 원인 → 화면</text>
<text x="800" y="905.0" font-size="10.5" fill="#1e293b" text-anchor="middle">/flow/weigh — 무게 재는 동안 표본마다 → 화면 눈금</text>
<text x="800" y="919.0" font-size="10.5" fill="#1e293b" text-anchor="middle">버튼 4개 (시작 · 일시 정지 · 재개 · 중단) → 서비스</text>
<text x="800" y="933.0" font-size="10.5" fill="#1e293b" text-anchor="middle">이동은 비동기 + 0.05 s 마다 완료 · 정지 신호 확인</text>
<text x="500.0" y="1132" font-size="10" fill="#64748b" text-anchor="middle">색: 파랑 = 로봇 단계 · 노랑 = 판단 · 빨강 = 멈춤/중단 · 주황 = 격리/털기 · 회색 = 기록/통신</text>
</svg>