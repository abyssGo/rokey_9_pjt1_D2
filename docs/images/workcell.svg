<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#222">워크셀 배치 (위에서 본 그림) — 용기 하나가 지나가는 길</text>
<rect x="40" y="60" width="880" height="480" rx="12" fill="#FAFAF7" stroke="#888780" stroke-dasharray="6 4"/>
<text x="56" y="84" fill="#666" font-size="12">작업대 · 컨트롤러·PC는 수조 반대편(오른쪽 밖)</text>
<!-- 반납구 -->
<rect x="70" y="110" width="170" height="110" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="155" y="130" text-anchor="middle" font-weight="600" fill="#2C2C2A">① 반납 구역 (고정 슬롯 2)</text>
<g fill="#F4C0D1" stroke="#993556"><ellipse cx="100" cy="160" rx="18" ry="13"/><ellipse cx="145" cy="160" rx="18" ry="13"/><ellipse cx="190" cy="160" rx="18" ry="13"/><circle cx="100" cy="198" r="11"/><circle cx="145" cy="198" r="11"/><circle cx="190" cy="198" r="11"/></g>
<text x="215" y="164" font-size="11" fill="#72243E">RET_B</text><text x="215" y="202" font-size="11" fill="#72243E">RET_C</text>
<!-- 잔반통 -->
<circle cx="155" cy="300" r="34" fill="#F1EFE8" stroke="#5F5E5A"/><circle cx="155" cy="300" r="22" fill="none" stroke="#5F5E5A"/><text x="155" y="352" text-anchor="middle" font-weight="600" fill="#2C2C2A">② 잔반통 · WEIGH</text><text x="155" y="368" text-anchor="middle" font-size="11" fill="#444">무게 → 털기 3~5회 → 재측정</text>
<!-- 격리 -->
<rect x="70" y="420" width="170" height="80" rx="8" fill="#FCEBEB" stroke="#A32D2D"/><text x="155" y="445" text-anchor="middle" font-weight="600" fill="#501313">격리 구역 ISOLATE</text><text x="155" y="465" text-anchor="middle" font-size="11" fill="#791F1F">잔반 미제거 · 안착/닦기 실패</text>
<!-- 스펀지 고정틀 -->
<rect x="300" y="110" width="220" height="120" rx="10" fill="#FAEEDA" stroke="#854F0B"/><text x="410" y="132" text-anchor="middle" font-weight="600" fill="#412402">③ 스펀지 고정틀 (SPONGE_BED)</text>
<ellipse cx="360" cy="180" rx="34" ry="24" fill="#fff" stroke="#BA7517"/><text x="360" y="184" text-anchor="middle" font-size="11" fill="#633806">그릇 홈</text>
<circle cx="460" cy="180" r="22" fill="#fff" stroke="#BA7517"/><text x="460" y="184" text-anchor="middle" font-size="11" fill="#633806">컵 홈</text>
<text x="410" y="222" text-anchor="middle" font-size="11" fill="#633806">안착 실패 → Move Periodic 탐색 · 힘제어 닦기(안쪽만)</text>
<!-- 툴 홀더 -->
<rect x="300" y="250" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="410" y="270" text-anchor="middle" font-weight="600" fill="#2C2C2A">툴 홀더</text>
<rect x="330" y="280" width="60" height="18" rx="3" fill="#FAC775" stroke="#854F0B"/><text x="360" y="293" text-anchor="middle" font-size="10" fill="#412402">수세미 툴</text>
<rect x="430" y="280" width="60" height="18" rx="3" fill="#FAC775" stroke="#854F0B"/><text x="460" y="293" text-anchor="middle" font-size="10" fill="#412402">수세미 솔</text>
<!-- 수조 -->
<rect x="580" y="110" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5"/><text x="655" y="135" text-anchor="middle" font-weight="600" fill="#042C53">세제 = 툴 홀더 비눗물</text><text x="655" y="155" text-anchor="middle" font-size="11" fill="#0C447C">툴을 쥔 채 비틀기·위아래 왕복</text>
<rect x="580" y="200" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5"/><text x="655" y="225" text-anchor="middle" font-weight="600" fill="#042C53">⑤ 헹굼 수조 RINSE</text><text x="655" y="245" text-anchor="middle" font-size="11" fill="#0C447C">담금 → 물 털기</text>
<!-- 랙 -->
<rect x="580" y="320" width="330" height="180" rx="10" fill="#E1F5EE" stroke="#0F6E56"/><text x="745" y="343" text-anchor="middle" font-weight="600" fill="#04342C">⑥ 식기세척기용 팔레트 (식기세척기용 팔레트 모형: 그릇 2칸·컵 2칸)</text>
<g stroke="#0F6E56" fill="none"><line x1="610" y1="380" x2="610" y2="430"/><line x1="640" y1="380" x2="640" y2="430"/><line x1="670" y1="380" x2="670" y2="430"/><line x1="700" y1="380" x2="700" y2="430"/></g>
<g fill="#F4C0D1" stroke="#993556"><path d="M612 428 L622 386 H634 L640 428 Z"/><path d="M642 428 L652 386 H664 L670 428 Z"/><path d="M672 428 L682 386 H694 L700 428 Z"/></g>
<text x="655" y="448" text-anchor="middle" font-size="11" fill="#085041">RACK_B1~B2 (칸 위에서 곧게)</text>
<g fill="#F4C0D1" stroke="#993556"><rect x="790" y="386" width="30" height="36" rx="4"/><rect x="830" y="386" width="30" height="36" rx="4"/></g>
<text x="825" y="448" text-anchor="middle" font-size="11" fill="#085041">RACK_C1~C2</text>
<text x="745" y="480" text-anchor="middle" font-size="11" fill="#085041">곧게 내려 놓기 + 마지막 15 mm 완충</text>
<!-- 로봇 -->
<circle cx="410" cy="420" r="34" fill="#D3D1C7" stroke="#5F5E5A"/><text x="410" y="425" text-anchor="middle" font-size="11" fill="#2C2C2A">M0609</text>
<line x1="410" y1="420" x2="470" y2="360" stroke="#5F5E5A" stroke-width="10" stroke-linecap="round" opacity=".6"/><line x1="470" y1="360" x2="520" y2="330" stroke="#5F5E5A" stroke-width="8" stroke-linecap="round" opacity=".6"/>
<text x="410" y="472" text-anchor="middle" font-size="11" fill="#444">+ RG2 · 반경 900 mm</text>
<!-- path -->
<g stroke="#444" stroke-dasharray="5 4" fill="none">
<path d="M155 222 V262" marker-end="url(#a)"/>
<path d="M192 300 Q250 300 300 200" marker-end="url(#a)"/>
<path d="M520 170 H578" marker-end="url(#a)"/>
<path d="M655 180 V198" marker-end="url(#a)"/>
<path d="M655 270 V318" marker-end="url(#a)"/>
</g>
<text x="56" y="565" font-size="12" fill="#555">경로: ① 반납 구역 → ② 잔반통 상공(무게·털기) → ③ 스펀지 홈(안착·툴 픽업·세제·닦기·툴 반납) → ⑤ 헹굼 → ⑥ 팔레트 지정 칸 · 실패 시 격리</text>
<text x="56" y="585" font-size="12" fill="#555">판단: 파지 폭(잡혔나) · 하중(잔반) · 툴 힘(닦기) · 위치(도달) — 비전·센서 없음</text>
</svg>
