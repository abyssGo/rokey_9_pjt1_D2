# rig_v03.py 전용 시험 설정 — 🚨 V-03 첫 실기용 보수적인 값. 팀 cell.yaml 이 아니다.
# 결과로 정한 값을 팀 cell.yaml 의 cell.force 에 넣는다.
cell:
  limits:
    safe_z_mm: 0.0              # rig 가 HOME 높이로 덮어쓴다(시험 전용)
    timeout_s: 40.0             # 접촉 하강 한 번의 시간 상한 (90 mm ÷ 6 mm/s = 15 s + 여유, 수세미)
    vel_carry_pct: 30           # move_rel 기본 속도 비율 (motion.py 가 읽는다 — 이 rig 는 속도를 늘 직접 준다)
  motion:                       # move_rel 속도 상한(100 % 기준, × vel_scale) — 팀 값이 비어 있어 시험용. config_virtual 과 같은 값
    vel_tcp_max_mm_s: 400       # × 0.3 = 120 mm/s 상한 (접촉 하강 6 · 후퇴 15 mm/s 는 그 아래)
    acc_tcp_max_mm_s2: 800
    vel_joint_max_deg_s: 100
    acc_joint_max_deg_s2: 200
    move_timeout_s: 30.0        # 이동 1번의 상한 시간 — 이동 함수 비동기화(V-24)로 새로 필요해진 값
  force:
    compliance_stx: [1000, 1000, 200, 100, 100, 100]   # N/m · Nm/rad — Z 500 → 200 (닿을 때 더 물렁하게)
                                                       #   수세미가 바닥을 물고 손목이 비틀릴 때 붙었다 떨어지며(스틱-슬립)
                                                       #   작업대를 흔들었다 → 옆·회전 방향을 물렁하게 해 충격을 흡수한다
    contact_step_mm: 3.0        # 한 걸음 — 0.5 는 너무 오래 걸린다 → 3 mm (순응이라 닿아도 한 걸음만큼만 눌림)
    contact_vel_mm_s: 20.0      # × vel_scale 0.3 = 6 mm/s
    contact_acc_mm_s2: 30.0     # 50 → 30 (걸음마다 급하게 서지 않게)
    retreat_vel_mm_s: 200.0     # × 0.3 = 60 mm/s — 내려올 때와 같은 속도로 곧게 상승
    retreat_acc_mm_s2: 200.0
    force_max_n: 15.0           # 어떤 순간에도 넘으면 안 되는 절대 상한 (닦기 상한 10 N 위)
    search_y_period_ratio: 2.0
