# rig_coords.py 시험 값 — 🚨 Virtual 전용. 진짜 cell.yaml 에서 **비어 있는** limits·motion 만 이 값으로 채워서 돈다(좌표는 진짜 값 그대로).
# limits.safe_z_mm(후퇴 높이)은 일부러 채우지 않는다 — 비어 있어도 이동 함수는 돌아야 한다(결정 E7).
# 실기 값이 아니다 — 실기의 안전 높이·속도는 cell.yaml 에 채운다.
fill:
  limits:
    vel_free_pct: 60                # 400 × 60 % = 240 mm/s — 🚨 컨트롤러의 수동 모드 TCP 속도 한계(250 mm/s)를 넘기면 이동을 도중에 세운다(실측: 300 mm/s 에서 RACK_C1 앞 122 mm 에 멈춤)
    vel_carry_pct: 50
  motion:
    vel_tcp_max_mm_s: 400
    acc_tcp_max_mm_s2: 800
    vel_joint_max_deg_s: 120
    acc_joint_max_deg_s2: 240
    move_timeout_s: 40
tol:
  joint_deg: 0.5                    # 관절 자세에 도착했는지
  pos_mm: 1.0                       # 직교 자세의 위치
  rot_deg: 1.0                      # 직교 자세의 방향
known_tilted: [RET_B]                      # ⚠ 접근점 → 끝점이 수직이 아닌 자세. RACK_C2 는 실기 좌표로 수직 정렬 완료
known_path_stop: [RACK_C1]          # ⚠ HOME → RACK_C1 직선 이동은 도중에 J1 이 빨리 돌아야 하는 구간을 지난다. 가상 컨트롤러가 수동 모드 속도 감시
                                    #   (TCP 275 mm/s · 로그 'mode=Manual')를 걸고 뜬 날에는 목표 122 mm 앞에서 세운다(속도를 60 mm/s 로 낮춰도 같다).
                                    #   감시가 없던 날에는 도착했다 → 🚨 실기 V-22 에서 이 구간을 천천히 확인한다. 막히면 경유 자세를 찍는다
settle_s: 0.3                       # 도착 뒤 자세를 읽기 전에 기다리는 시간
