# rig_v03.py 시험 값 — V-03 힘제어 중 XY 이동 (솔로 그릇 안쪽 바닥 누르며 문지르기)
# 🟡 approach_down_mm 은 현장 실측(솔 끝 → 그릇 안쪽 바닥 거리 − 30 mm)으로 채운다. 비어 있으면 실기에서 실행 거부.
home_posj: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]   # HOME (실기 확인: X 367.5 · Y 8.0 · Z 215.0, 그릇 중심이 바로 아래)
expected_tool: Tool Weight           # 컨트롤러에 설정돼 있어야 할 툴 무게 이름 — 다르면 실행 거부 (실기 2회차: 브링업 재시작 뒤 '' 로 비어 있었음)
expected_tcp: GripperDA_v1           # TCP 이름 — 다르면 실행 거부
air_force_max_n: 3.0              # 공중에서 |Fz| 가 이보다 크면 툴 무게 설정이 틀린 것 → 실행 거부
home_vel_deg_s: 40                # × vel_scale (0.3 → 12°/s) — HOME 이동·복귀 2배
home_acc_deg_s2: 40
approach_down_mm: 135.0           # 빠른 하강 (132 → 135). 실측 바닥은 HOME 아래 약 145~149 mm
                                  #   그릇 안쪽 바닥은 상판보다 2 mm 높다 → 여기서부터는 천천히 힘으로 찾는다
                                  #   (계산도 145: 솔로 닿은 TCP 130.6 − 솔 95 = 바닥 35.6 → 수세미 35 면 TCP 70.6, HOME 215)
virtual_approach_down_mm: 120.0   # Virtual 흐름 확인용
approach_vel_mm_s: 200.0          # × vel_scale (0.3 → 60 mm/s) — 2배
approach_acc_mm_s2: 200.0
contact_max_depth_mm: 30.0        # 천천히 찾는 거리 — 130 + 30 이면 실측 142 를 덮는다 (12 mm/s → 최대 2.5 s)
contact_limit_n: 2.0              # 시작 힘보다 이만큼 커지면 '바닥' — 수세미가 스펀지라 힘이 늦게 올라온다
press_targets_n: [1.5]            # 제자리 누르기 목표
press_hold_s: 1.5                 # 제자리 누르기 확인 시간 (3 → 1.5, 시험용일 뿐 세척과 무관)
wipe_target_n: 1.5                # 닦는 동안 유지할 누르는 힘 (공중 기준값은 코드가 더해 준다)
press_mode: force                 # force = 닦는 동안 **목표 힘을 유지**(결정 E13) · depth = 정해진 깊이만 눌러 두기
                                  #   force = 목표 힘까지 알아서 내려감 · depth = 순응만 켜고 press_depth_mm 만 내려감
after_contact_mm: 0.0             # 접촉한 그 자리에서 그대로 시작 (더 누르지 않는다 — 결정 E13)
                                  #   순응 Z 200 N/m → 3 mm 면 약 0.6 N. 힘제어로 밀어 넣는 것과 달리 깊이가 정해져 있다
                                  #   (− 로 주면 그만큼 들어 올린다)
                                  #   무른 수세미는 힘이 잡힐 때까지 이미 몇 mm 눌린다 → 그만큼 되돌려야 '살짝 닿음'이 된다
                                  #   + 면 그만큼 더 누름(Z 순응 500 N/m → 1 mm 당 약 0.5 N) · 0 이면 닿은 자리 그대로
                                  #   바닥을 누르면 마찰로 작업대가 흔들려서 살짝 띄운다. 수세미가 물러 1 mm 면 여전히 닿는다
press_vel_mm_s: 20.0              # 누를 때 내려가는 속도 (× vel_scale)
press_acc_mm_s2: 50.0
limit_n: 10.0                     # 이 힘을 넘으면 즉시 힘 해제 (NFR-01 닦기 10 N)
tol_n: 1.0                        # 통과 기준: 평균이 목표 ±1.0 N (목표가 낮아져 함께 좁힘)
settle_s: 0.5                     # 힘을 건 뒤 안정 대기 (1 → 0.5)
sample_s: 0.05                    # 힘 기록 주기
log_dir: logs/v03                 # 힘 로그 CSV (실행 위치 기준 상대경로)
# ── 나선 문지르기 · 벽 찾기 · 벽 따라 돌기 (방식 확정: 8자 대신) ──
scrub_deg: 18.0                   # 손목 좌우 비틀기 각(±)
twist_every: 2                    # 이 걸음 수마다 손목 방향을 바꾼다 (1 = 매 걸음 — 실기에서 덜컹·소음)
scrub_step_mm: 7.0                # 한 걸음(호 길이) — 5 → 7 (명령 수가 줄어 더 이어진다)
scrub_lin_vel_mm_s: 600.0         # × vel_scale (0.3 → 180 mm/s) — 바닥에서 띄우니 더 빠르게
scrub_rot_vel_deg_s: 400.0        # × vel_scale (0.3 → 120°/s) — 740 에서 삑삑 경고음 → 낮춤
scrub_lin_acc_mm_s2: 3000.0       # 짧은 걸음은 가속이 시간을 정한다 (띄워서 문지르므로 충격이 바닥에 안 간다)
scrub_rot_acc_deg_s2: 1000.0      # 4000 → 1000 (경고음·진동)
blend_radius_mm: 3.0              # 걸음(7 mm)의 절반 아래여야 이어 붙는다
spiral_pitch_mm: 5.0              # 한 바퀴에 넓어지는 반지름 → 반지름 14 mm 면 약 3바퀴.
                                  #   🚨 자료 경고: '최대 반경과 회전 수' 조합에 따라 속도/가속도 오류(중급1 p.69).
                                  #   공중에서 확인된 조합은 반경 20 mm · 3바퀴 · 3 s 였다
# 🔸 그릇 크기는 정해 두지 않는다 — 힘으로 벽을 찾는다. 아래는 셀이 받을 수 있는 그릇의 **범위**
bowl_r_max_mm: 150.0              # 가장 큰 그릇 안쪽 반지름 → 솔 중심 최대 반지름 = 150 − 솔 반지름 + 여유 (여기까지 벽이 없으면 중단)
                                  # 가장 작은 그릇 = 솔과 같은 크기 → 가운데부터 벽일 수 있다(못 따라간 거리로 판정하므로 그대로 동작)
brush_d_mm: 90.0                  # 지금 달린 툴의 지름 — 수세미 Ø90 (솔은 55)
bowl_inner_d_mm: 110.0            # 🔸 결정 E6: 그릇 안지름을 넣는다. 수세미가 물러서 벽에 눌려도 잘 막히지 않아
                                  #   힘·못 따라간 거리로는 벽을 못 찾는다 → 벽 반지름 = (110 − 90) / 2 + wall_press_mm
wall_press_mm: 4.0                # 벽을 이만큼 **밀면서** 돈다 (1 → 4). 순응 X·Y 1000 N/m → 약 4 N 으로 누름.
                                  #   그릇이 조금 틀어져도 한쪽만 닿지 않게, 벽 쪽으로 밀어 붙여 크게 돈다
r_max_margin_mm: 5.0              # 최대 반지름 여유
wall_gap_mm: 2.0                  # (안전장치) 정해진 반지름 전에 이만큼 못 따라가면 거기서 멈춘다 — 그릇이 작거나 잘못 놓였을 때
                                  #   실기: 힘으로는 마찰(안쪽 5 N)과 벽(6 N)을 구분 못 함. 마찰은 진행 방향이라
                                  #   반지름을 줄이지 않고, 벽은 실제로 못 가게 막는다. 걸음 중 못 따라간 거리는 1 mm 이하였다.
climb_max_mm: 8.0                 # 솔이 바닥에서 이만큼 넘게 올라가면 벽(벽을 타고 오름) — 안전 판정, 벽 따라가기면 안쪽으로
wall_confirm: 1                   # 연속 이 횟수면 벽 (1 이 안전: 한 걸음 더 보면 그만큼 더 파고든다)
arcs_per_turn: 8                  # 한 바퀴를 원호 몇 구간으로 나눌지 — 구간마다 손목 비틀기 방향이 바뀐다 (8 = 45°마다)
spiral_time_s: 3.0                # 바닥 나선에 걸리는 시간 — 🚨 1.5 s 로 줄이면 나선이 시작조차 하지 않는다(실기).
                                  #   자료 경고 그대로: '최대 반경과 회전 수' 대비 속도가 과하면 거부된다(중급1 p.69)
wall_arc_deg: 90.0                # 벽면을 도는 원호 하나의 각도 (90° = 한 바퀴 4개)
wall_approach_vel_mm_s: 60.0      # 벽으로 밀어 붙일 때 속도 (× vel_scale → 18 mm/s). 한 번에 튀어나가면 벽을 세게 박는다
force_every: 4                    # 힘을 몇 걸음마다 확인할지 — 매 걸음 읽으면 서비스 왕복 때문에 움직임이 끊긴다
circle_turns: 3                   # 벽면을 도는 바퀴 수 (3바퀴, 나선과 반대 방향)
circle_reverse: true              # 벽 따라 돌기는 나선과 반대 방향 (같은 방향이면 나선 마지막 바퀴와 겹쳐 안 보임 — 실기 5회차)
circle_pause_s: 0.5               # 벽 발견 → 벽 따라 돌기 사이에 벽에 닿은 채 멈추는 시간
lateral_max_n: 25.0               # 옆 힘 비상 정지 기준 — 도는 중에는 판단하지 않고, 이 값을 넘을 때만 멈춘다
scrub_timeout_s: 300.0            # 나선·원 각각의 시간 상한
# ── Virtual 전용 가짜 벽 (--fake-wall) — 힘이 없는 Virtual 에서 나선 → 벽 → 2바퀴 흐름·시간 확인. 실기에서는 거부 ──
fake_bowl_inner_d_mm: 110.0       # 가짜 그릇 안지름 (우리 그릇 CELL-02a 실측) → 벽 = (110 − 55) / 2 = 27.5 mm. --fake-bowl-d 로 바꾼다
fake_wall_k_n_per_mm: 3.0         # 벽을 1 mm 밀 때 되미는 힘 (순응 X·Y 강성 3000 N/m 와 같게 — 실제로도 이보다 딱딱할 수 없다)
fake_bowl_offset_mm: [3.0, 0.0]   # 그릇 중심이 HOME 아래에서 어긋난 양 (BASE X·Y) — 벽 따라가기가 보이게
