# rig_motion.py 시험 값 — 🚨 Virtual 전용. 좌표·속도는 같은 폴더의 config_virtual/cell.yaml.
rounds: 3                       # 아래 순서를 몇 바퀴 도는가 (같은 함수 연속 3회 이상 — SDD §3.2 ⑧)
pos_tol_mm: 1.0                 # 도착 위치 허용 오차
joint_tol_deg: 0.5              # 도착 관절각 허용 오차
tool_step_mm: 30                # move_rel TOOL 축 시험 거리
slow:                           # move_rel 속도 선택 인자 시험 (force.py 의 접촉 하강처럼 아주 느리게)
  dx_mm: 20
  vel_mm_s: 10
  acc_mm_s2: 40
  min_time_s: 1.5               # 이보다 빨리 끝나면 속도 인자가 안 먹은 것
shake:                          # move_joint_rel 시험 (f2 shake 의 J5 왕복 흉내)
  joint: 5
  amp_deg: 15
  half_period_s: 0.3
  time_tol_s: 0.4
spin: {joint: 6, delta_deg: 10}  # 시간 없이(기본 속도) 관절 이동
