# rig_gripper.py 전용 시험 설정 — 🚨 팀 cell.yaml 이 아니다.
#
# 왜 따로 두나: grip_level 이 읽는 presets 의 힘 값이 팀 cell.yaml 에서 아직 **전부 비어 있다**.
#   그 값을 정하는 것이 V-16(HOLD 값 찾기)이고 그게 이 시험의 목적이다 → 닭-달걀이라 팀 파일에 기댈 수 없다.
#   여기 값은 **시작값**일 뿐이고, V-23·V-16 으로 확정한 값을 팀 cell.yaml 에 넣는다.
# 출처: docs/03_설계_SDD.md §4.3 예시값 (지어낸 숫자가 아니다).
cell:
  limits:
    timeout_s: 10.0             # 그리퍼 동작 한 번의 시간 상한 (_wait_done · 서비스 대기)

  presets:                      # 🟡 전부 시작값 — 확정은 V-01(폭·tol) · V-16(hold_force_n)
    BOWL:
      grip_zero_mm: 10.58       # ✅ V-01 실측 — 빈손 10회 평균(흔들림 0.20)
                                #    결정 E16 D-A — 판정은 `읽은 폭 − 영점`, 명령은 `영점 + 목표`
      grip_width_mm: 2.15       # ✅ V-01 실측(영점 뺀 값) — 실측 벽 두께 2 mm 와 일치
      grip_force_n: 20          # NORMAL
      hold_force_n: 35          # HOLD  ← V-16 에서 "낙하 없는 최소 힘" 으로 확정
      width_tol_mm: 0.6         # ✅ V-01 — 흔들림 0.30 < tol < 간격/2 (1.00)
    CUP:
      grip_zero_mm: 10.58       # 그릇과 같은 값 (빈손 영점은 용기와 무관하다)
      # 🚨 결정 E19 — 컵은 **78 mm 에서 멈춘다**(끝까지 닫지 않는다) · 파지 확인은 **생략**한다
      #    이유: RG2 최저 힘 5 N(2.5 N 은 사양 밖)으로도 컵이 눈에 보이게 눌린다.
      #    대가(실측으로 확인, 감수하기로 함):
      #      ① 빈손과 구분이 안 된다 — 컵 77.90 vs 빈손 77.80(차이 0.10 < 흔들림 0.20)
      #         → 컵을 놓쳐도 모르고 공정을 끝까지 돈다
      #      ② 🚨 **힘 전환(NORMAL→HOLD)이 안 먹는다** — 목표 폭에 이미 도달해 '다시 잡기' 가
      #         일어나지 않는다(10 N 요청 → 5 N 유지, 3회 모두). 털기는 5 N 으로 버텨야 한다
      #         → V-07 에서 확인한다
      grip_target_mm: 78.0      # 닫는 목표(드라이버 값 · 영점 포함). 이 값에서 멈춘다
      grip_width_mm: 67.4       # = 78.0 − 영점 10.58 (참고값 — 파지 확인을 안 하므로 판정에 쓰지 않는다)
                                #    🚨 컵은 아래로 갈수록 좁다(상단 75 · 하단 55) → **잡는 높이가 폭을 정한다.**
                                #    70.0 은 상단 근처를 가정한 값이었다. 파지 높이는 F1 집기가 정한다
                                #    → 높이가 정해지면 이 값도 같이 바뀐다. V-23 은 '쥔 채 힘 전환' 만 보므로 이대로 진행
      grip_force_n: 5          # 실측 — **15 N 에서 컵이 눈으로 보이게 변형**(실기 관찰)
                                #    RG2 데이터시트 유효 범위는 3~40 N → 5 N 부터 다시 올려 가며 찾는다(V-16)
      hold_force_n: 10         # 같은 이유로 낮춤. 털 때 안 떨어지는 최소값은 V-16 에서 확정
      width_tol_mm: 10.0        # 컵은 아래로 갈수록 좁아(상단 75·하단 55) 잡는 높이가
                                #    폭을 정한다(실측 57~63 으로 흔들림). 그런데 **빈손 10.5 와는 60 mm 넘게**
                                #    떨어져 있어 넉넉히 잡아도 안 겹친다 — 정확한 폭이 아니라 '잡았나' 만 보면 된다.
                                #    그릇(빈손과 2.7 mm 차이)은 촘촘해야 해서 0.8 그대로 둔다
