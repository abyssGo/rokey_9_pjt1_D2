# params.yaml — 기능별 절(f1 · f2 · f3 · flow · hmi). (SDD §4.3, IRD §9)
#
# 절마다 키 골격은 INF-04 에서 만들었다. 값은 검증 결과로 바꾸고, 값 옆 주석에 단위·범위·바꾼 이유를 적는다.
#   - 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋)은 여기 두지 않는다 → cell.yaml.
#   - 코드에서는  cc.cfg()['f3']['wipe_bowl']['limit_n']  처럼 읽는다. 숫자를 코드에 쓰지 않는다.
#
# 표기 — E-nn: 팀 결정 번호(docs/meetings/20260919_결정기록_DSN-03.md) · V-nn/INT-nn: 검증 항목(docs/test_logs/) · TS-nn: 트러블슈팅(docs/troubleshooting/)

f1:                                   # ── f1 절 ── 값은 SDD §4.3 예시에서 시작해 검증으로 확정
  insert_approach_mm: 0               # 팔레트 삽입 전 힘 감시 하강 거리(mm). 0 = 칸 자세가 정확해 감시 없이 곧게 내려 놓는다(마지막 land_slow_mm 완충) —
                                      #   이때 걸림 판정(RACK_JAM)은 없고 걸리면 로봇 충돌 감지(SAFE_STOP). 20 이었을 때 0.3 배속에서 contact_down(3 mm 씩 20 mm/s × vel_scale)이
                                      #   접촉 타임아웃 10 s(cell.limits.timeout_s)를 넘겼고(E33), 5 로 줄여 놓기까지 15 s 절약 → 마지막엔 0. 감시를 되살리려면 5
  tool_return_contact_n: 8            # 툴 반납 때 홀더 바닥 접촉 판정 힘, V-08·F1-03 에서 확정
  place_clear_mm: 100                 # 접근점이 없는 자리에 놓은 뒤 위로 빠지는 높이 — 티칭 스크립트의 'z +100'(F1-01). 접근점이 있는 자리는 내려간 만큼 되올라온다
  tool_clear_mm: 100                  # 툴을 집은 뒤·반납한 뒤 홀더에서 수직으로 빠지는 높이(접근점이 없을 때) — F1-03·V-08 에서 확정
  contact_timeout_min_s: 30           # 접촉 감시 하강의 최소 시간 상한(s) — 리허설 0.5 배속에서 솔 반납 contact_down 이 20 mm 를 다 내려갔는데도
                                      #   20 s(10 ÷ 0.5)를 넘겨 TIMEOUT(정책 retry 로 넘어감). 순응 걸음(3 mm)이 ≈3 s 라 20 mm ≈ 21 s — 배속과 무관.
                                      #   0.3 에선 33 s 라 통과. 이 값 이하로는 안 줄인다(handling._contact_timeout). 팔레트 삽입은 닿으면 바로 끝나 영향 없음.
  contact_timeout_ref_mm: 20          # 접촉 타임아웃(cell.limits.timeout_s)이 맞춰진 기준 감시 거리(mm). contact_down 은 3 mm 걸음(걸음당 ≈0.8 s ·
                                      #   가속 제한이라 배속과 거의 무관)이라 이보다 긴 감시는 timeout 을 거리 비례로 늘린다(handling._contact_timeout · 값은 YAML 에)
  regrip_watch_mm: 0                 # 홈 C 옆면 재파지에서 접근점(+100)부터 내려올 때 마지막 이만큼을 힘 감시(cell.limits.insert_limit_n). 0 = 감시 없이 곧게
                                      #   내려가 바로 잡기(handling._regrip · 마지막 land_slow_mm 완충) — 실기 확인(E50) · 되돌리기 = 45
                                      #   45 의 근거: 관절 이동으로 곧장 가다 열린 그리퍼가 컵에 걸려 SAFE_STOP 이 났고(실기), 손가락이 컵 테두리에 얹히면 힘 상한에서
                                      #   멈춰 되올라와 GRIP_FAIL. 컵 윗단은 잡는 높이보다 약 45 mm 위라 그 구간부터 감시해야 XY 어긋남을 잡는다(20 이면 감시 밖).
  tool_return_depth_mm: 0             # 툴 반납 때 홀더 바닥을 찾아 내려가는 최대 깊이. 0 = 집은 자리로 곧게 내려가 바로 놓는다(handling._tool_return 0 갈래 · 마지막 land_slow_mm 완충)
                                      #   — 반납 자리는 이 프로그램이 집은 posx 라 바닥 찾기가 불필요하고, 1.0 배속 실기에서 남은 힘 감시가 '힘 제어가 남아 있다' 로 보였다.
                                      #   5 로 두면 마지막 5 mm 만 힘 감시(홀더가 밀렸으면 8 N 에 멈춰 되올라옴 · 걸음 2개 ≈6 s). 0 이면 홀더 밀림 보호는 로봇 충돌 감지(SAFE_STOP)뿐.
                                      #   주의: 크게 잡으면 못 찾았을 때 툴을 깊이 밀어 넣는다 — 여기까지 내려가도 안 닿으면 놓지 않고 TOOL_FAIL(F1-03)
  watch_step_mm: 5                    # 마지막 감시 구간(툴 반납·팔레트 삽입)의 순응 하강 걸음(mm) — 순응 걸음 하나가 배속과 무관하게 ≈3 s 라
                                      #   (컨트롤러가 순응 상태의 이동 끝을 늦게 잡음) 3 + 2 두 걸음이면 ≈6 s 가만히 선 듯 보였다 → 5 mm 한 걸음(≈3 s).
                                      #   걸음은 감시 거리보다 크지 않게 min(handling._watch_step). 재파지·닦기 바닥 찾기는 그대로 3 mm(cell.force.contact_step_mm).
                                      #   닿을 때 눌리는 힘 = Z 강성 200 N/m × 5 mm = 1 N(3 mm 는 0.6 N) — 걸림 판정 15 N 과 멀다. 비우면 3 mm 걸음으로 돌아간다.
  land_slow_mm: 15                    # 곧게 내려 놓을 때(놓기·적재·툴 반납 · 감시 0) 마지막 이만큼을 아래 속도로 살짝 느리게 — 1.0 배속에서 바닥 충격 완충(솔 반납 SAFE_STOP 의심). 0 = 한 구간
  land_vel_mm_s: 30                   #   그 구간 속도(mm/s · 배속 무관 · 15 mm ≈ 0.5 s). handling._descend

f2:                                   # ── f2 절 ── 값은 SDD §4.3 예시에서 시작해 검증으로 확정
  empty_weight_g:                     # 빈 용기 기준값 — 판정은 (측정값 − 기준값)
                                      # 주의: 저울로 잰 '진짜 무게' 가 아니라 로봇이 읽은 값이다.
                                      #    로봇 하중에는 정체불명 옵셋이 있다(V-02: +42~45 g, 원인 미확정).
                                      #    같은 경로·같은 자세로 재야 판정식에서 상쇄된다.
                                      #    저울 값을 넣으면 빈 용기가 잔반 43 g 으로 보인다.
                                      # 재측정: soc && python3 src/f2_sense_flow/test/rig_f2.py empty --kind BOWL
                                      #    브링업을 다시 했으면(다른 세션) 값이 달라질 수 있다 → 시연 날 아침, 실행 직전에 1회 다시 잰다
    BOWL: -1                          # 실기(rig_f2 empty · HOME 경유 3회 중앙값 −1.2 · 회차 폭 19 g · 흐름 최대 −23) — 시연 날 아침 값(전 값 −47)
                                      #   같은 자세라도 오는 길에 따라 60~90 g 다르다(집어 올린 자리에서 바로 −113~−144 · HOME 거쳐 −23~−67)
                                      #   → sense.weigh 가 항상 HOME 을 거치도록 통일. 이 값도 반드시 rig_f2 empty(HOME 경유)로 잰 값이어야 한다.
                                      #   켠 직후에는 힘 센서 드리프트로 40분 사이 +40 g 움직인 날도 있었다(−58 → −23) → 기준값은 실행 직전 1회 로 잡는다
    CUP: 1                            # 실기(rig_f2 empty · HOME 경유 3회 중앙값 0.7 · 회차 폭 32 g · 떨림 최대 49) — 시연 날 아침 값(전 값 15)
                                      #   같은 날 아침 −17 → 30 → 15 로 움직였다(워밍업 · 방향 일정치 않음) → 기준값은 실행 직전 1회 로 잡는 절차 확정
  leftover_threshold_g: 50            # 잔반 판정 임계 (SR-05). V-02 정밀도 미달이면 100 (SDD §9.9)
                                      # "50 → 100" 제안은 보류: TCP 풀림 시간대 측정에서 +107 g 이 +86 g 으로 읽혔다(이득 ≈ 0.8). 100 이면 대용품 107 g 을
                                      #    놓칠 수 있다. INT-12a 에서 같은 경로로 빈 그릇·대용품을 재서 정한다(후보 70).
                                      #    그 전까지 50 · 빈 그릇 흔들림 ±22 < 50
  weigh_samples: 15                   # weigh() 중앙값 표본 수 (× weigh_sample_gap_s 0.5 → 약 7 s 창). 표본은 하나 읽을 때마다 화면에 보인다(/flow/weigh)
                                      # 5 → 10 → 30 → 15: 30(0.7 s 간격 · 21 s 창)은 흔들림 한 주기를 다 덮어 정확했지만 무게 1회가 너무 길었다 → 15(7 s 창)로 줄였다.
                                      #    주의: 정지해도 ±22 g 가 10~20 s 주기로 오르내린다(V-02 · 폭 44.8 g). 7 s 창은 한 주기보다 짧아 중앙값이 그만큼(최대 ±22 g) 치우칠 수 있다 —
                                      #    임계 50 g 과 대용품(≥ 100 g) 사이 여유로 가른다. 용기당 무게 1회 ≈ 8 + 7 s. 잔반이면 최대 3회
  weigh_sample_gap_s: 0.5             # 읽기 사이 간격(s). 주의: 0 이면 컨트롤러 갱신 전에 같은 값을 반복해 읽는다(실기: 50 개 전부 −48.7)
  weigh_settle_s: 8.0                 # 재기 전 정지 대기 — 하중은 흔들리면 튄다 (SDD §5.3)
                                      # 8 (E40): 긴 이동(잔반통 → HOME → WEIGH) 직후 재는 창(당시 21 s) 안에서 값이 +47 g 흘렀다(관절 토크 추정이 이동 뒤 가라앉는 시간).
                                      #   용기당 약 +3 s × 측정 횟수. 시연 배속 0.5 도 같은 값. 그 전 5: 도착 뒤 약 5 s 동안 +30 g 높게 읽히다 가라앉았다(117 → 85 g)
  weigh_reset_timeout_s: 3.0          # 0점 재설정 응답 상한. 넘으면 포기하고 계속 (TS-03)
  limits:                             # 주의: 오타 방어 — 넘는 값이 들어오면 움직이기 전에 거절한다
                                      #    (amp_deg 를 15 대신 150 으로 적으면 용기를 쥔 채 300° 를 왕복한다)
    max_amp_deg: 45                   # 털기 진폭 상한
    max_tilt_deg: 100                 # 털기 전 기울이기 상한(|tilt_deg|) — 90 이면 입이 정확히 아래
    max_amp_mm: 60                    # 직선 왕복 진폭 상한(mm) — 수조 안에서 벽까지 여유
    max_depth_mm: 150                 # 담금 깊이 상한 (수조 깊이 − 용기 높이보다 작아야 한다 — V-07)
    max_hold_s: 5.0                   # 한 번 유지 시간 상한
    max_settle_s: 10.0                # 재기 전 정지 대기 상한 — weigh_settle_s 8 을 허용(E40). sense.weigh 가 이 값을 넘는 설정을 거부한다
    max_weigh_drift_g: 20             # 영점 흐름 경고 — 재는 창(약 7 s) 안에서 값이 한 방향으로 이 이상 움직이면 경고(멈추지 않음).
                                      #   실기(표본 30 · 21 s 창): −96 → −123 으로 −26 g 미끄러졌다. 영점이 움직이는 중이면 5 시간 전 기준값은 못 쓴다
                                      #   → 잔반 판정을 믿지 말고 rig_f2.py empty 로 다시 재라는 신호. 제한: 임시값 — 정상 창의 흐름을 보고 조정
    max_weigh_spread_g: 80            # 케이블 장력 상한 — 무게 잴 때 표본의 떨림(추세를 뺀 10~90 % 폭)이 이보다 크면 그 자리에서 멈춘다
                                      #   (sense.weigh → CableTightError → 넛지 또는 재개 → 멈춘 단계부터 다시 — 무게를 HOME 경유로 다시 잰다 · 아직 떨리면 같은 멈춤 · E64).
                                      #   cc.weigh(공용 함수) 자체는 경고 로그만 남긴다. 시작 전 점검은 flow.preflight.cable.max_spread_g 를 따로 쓴다.
                                      #   80 (E47): 정상 흐름의 떨림이 8~45 g(컵 1 45)라 50 은 오탐 여지 — 실기: 정상 흐름 오탐 없음 · 케이블 멈춤 → 밀기 1번 → 무게 다시 통과(리허설 1회)
                                      #   '퍼짐' 이 아니라 '떨림' 인 이유: 흐름이 섞이면 거짓 경보가 난다(퍼짐 52 인데 떨림은 12). V-02: 케이블 정리 뒤 21 s 창 ±12~17 · 정리 전 ±25
    min_net_g: -60.0                  # 주의: 잔반 무게가 이보다 작으면 파지를 의심한다 — 바로 GRIP_FAIL 이 아니라
                                      #    그리퍼 폭으로 한 번 더 확인한다(sense._held_by_width). 폭이 빈손이면 GRIP_FAIL,
                                      #    쥐고 있으면 '기준값(empty_weight_g)이 낡았다' 고 경고만 하고 지나간다(잔반 판정은 그 바퀴만 못 믿는다).
                                      #    왜: 실기에서 −12 g 자리가 −117.5 g 으로 읽혀(툴 무게 등록 등 영점 이동) 멀쩡한 그릇이 GRIP_FAIL 로 막혔다
                                      #    빈손이면 하중이 옵셋만 남아 net 이 크게 음수가 된다
                                      # −60 (V-02): 정지 흔들림 폭 44.8 g(±22)이 TCP 복구 뒤에도 그대로라 −30 이면 빈 그릇도 걸린다.
                                      #    빈손은 그릇 대비 약 −85 g → −60 이면 놓침은 잡는다.
  slip_tol_mm: {BOWL: 1.0, CUP: 1.5}  # 털기·담금 전후 그리퍼 폭이 이보다 변하면 미끄러진 것(GRIP_FAIL). 종류별인 이유: 컵 98 g 잔반 털기 HOLD 뒤 컵 테두리가 눌려
                                      #   12.2 → 11.2(1.00 mm) → 공통 1.0 에 걸려 GRIP_FAIL·PAUSED(놓친 게 아님). 그릇은 0.4 만 변해 1.0 유지 · 컵 1.5(놓친 컵은 다음 weigh 가 잡음).
                                      #   1.0 의 근거(V-05·V-01·V-23 실기) — 아래 셋 사이에 들어가야 한다, 1.0 이 가운데다:
                                      #      0.20 mm  폭 읽기 흔들림 (V-05 최대)
                                      #      0.70 mm  V-23 첫 NORMAL→HOLD 전환의 정상 변화 ← 이보다 커야 헛경보가 안 난다
                                      #      2.15 mm  그릇 파지 폭 (V-01) ← 이보다 작아야 진짜 놓친 것을 잡는다
  gripper_box:                        # 그리퍼를 다루는 작은 상자(OnRobot 컴퓨트박스)와 직접 말하는 값 — cc.grip_safety() · cc.grip_reset()
    ip: 192.168.1.1                   # 상자 주소 — m0609_rg2_bringup/launch/bringup.launch.py 의 /onrobot/ip 와 같아야 한다
    port: 502                         # Modbus/TCP
    tool_unit: 65                     # 그리퍼(툴) 번호 — 상태를 읽는 곳 (드라이버의 changer_addr 과 같다)
    box_unit: 63                      # 상자 자신 — 전원 재시작 명령을 받는 곳
    status_addr: 258                  # 상태 레지스터 시작 칸 (12~16번째가 안전 스위치)
    status_count: 18                  # 한 번에 읽는 칸 수 — 드라이버(comModbusTcp.getStatus)와 같은 범위
    restart_addr: 0                   # 이 칸에 restart_value 를 쓰면 툴 전원을 잠깐 껐다 켠다
    restart_value: 2
    connect_timeout_s: 1.0            # 상자 응답 상한
    restart_wait_s: 8.0               # 전원이 다시 들어오기를 기다리는 상한
    driver_alive_s: 2.0               # 전원 재시작 뒤 /onrobot_joint_states 가 이 시간 안에 안 오면 드라이버가 죽은 것으로 본다
  shake:                              # joint = 흔들 관절(1~6). period_s = 한 주기 시간. shake() 가 구간별로 나눠 쓴다
                                      #   (가운데↔끝 = period/4, 끝↔반대끝 = period/2)
    WASTE: {joint: 5, amp_deg: 15, cycles: 4, period_s: 0.6, tilt_deg: -90, smooth: true, fast: true, acc_deg_s2: 600}   # 잔반 털기(V-07 에서 조정) · 물 털기처럼 스플라인 한 번(smooth) · 배속 예외(fast) · 평균 100 °/s
                                      # tilt_deg (V-07 실기): 똑바로 든 채 흔들면 입이 위를 봐서 고형 잔반이 안 쏟아진다
                                      #   → 흔들기 전에 J5 를 tilt_deg 만큼 기울여(입이 잔반통 쪽) 그 자세를 가운데로 ±amp 흔들고 되돌린다.
                                      #   rig_jog 실기: J5 90 → 0 (−90°)에서 입이 잔반통 쪽 · 쏟아지는 각도.
                                      #      그때 posj [-180, 0, 90, 0, 0, 180] · posx z 544 (그릇이 잔반통 위 높이). 상한 limits.max_tilt_deg
                                      #   ±30°·1.0 s 로 키워 봤던 것은 되돌림(똑바로 든 채라 의미 없었다)
    RINSE:                            # 물 털기 — 결정 E36: 담금 2회 뒤 위로 곧게 빼서(접근점 z 235) 4번 관절 좌우 왕복 · 수조 안 J5 까딱은 폐기
                                      #   at: RINSE_SHAKE → 접근점(수조 위 235)까지 곧게 올라온 뒤 관절 이동으로 털기 자세(cell.stations.RINSE_SHAKE)로 가서 턴다 · 끝나도 거기(높은 자세)
                                      #   at: approach 로 두면 접근점에서 바로 턴다(실기: 밋밋해서 안 씀)
                                      #   smooth: true → 왕복을 관절 스플라인 한 번(amovesj)으로 — 구간마다 서지 않고 +amp ↔ −amp 를 한 곡선으로("3단계로 보인다" 를 없앰)
                                      #   fast: true → vel_scale 예외(E17 취지 · cc.move_joint_rel scale=False) — 배속을 낮춰도 설정한 주기로 턴다
                                      #   값 조정은 rig_shake_tune --mode RINSE 로 a/A(진폭) p/P(주기) 바꿔 보고 w 로 찍는다
                                      #   period_s = 한 주기 → 속도 = 4·amp/period(deg/s) · acc_deg_s2 = 가속도. 상한은 cell.motion.vel/acc_joint_fast_max(180 · 600 · 물 털기 전용 · 두산 손목 한계 225 아래)
      BOWL: {joint: 4, amp_deg: 30, period_s: 0.7, acc_deg_s2: 600, at: RINSE_SHAKE, fast: true, smooth: true}   # 그릇 — 털기 자세(z 600 · 툴 옆으로)에서 J4 ±30° · 평균 171 °/s(전용 상한 180) · 가속 600 · "사람이 물 털 듯 빠르게"
      CUP:  {joint: 4, amp_deg: 15, period_s: 0.8, acc_deg_s2: 400, at: RINSE_SHAKE, fast: true, smooth: true}   # 컵 — 옆면 재파지 기준(E38 · CUP_SIDE 70 mm·10 N · HOLD 못 세게)으로 낮춤 · 제한: 첫 컵 헹굼 실기로 조정(벽 집기 실기값은 ±25°·0.7 s·600 이었음)
                                      #   직선 왕복이 필요하면 {axis: x, amp_mm: 20, period_s: 0.5, acc_mm_s2: 800} (코드 있음 · 상한 max_amp_mm · fast 불가)
  dip:                                # depth_mm = 티칭 자세에서 내려가는 거리 (SDD §5.3)
    RINSE: {depth_mm: 60, hold_s: 1.0}                # 헹굼 담금, 60 확인은 V-07
  nudge:                                # 넛지(로봇팔 가볍게 밀기) 재개 설정 — force_threshold_n · poll_gap_s 는 케이블 멈춤 감지용, settle_s 는 넛지 멈춤 공통
    force_threshold_n: 15.0             # 넛지 감지 외력 변화량 임계값(N · 정지 외력 대비). E48: 툴 놓침 넛지(cell.limits.nudge_force_n 15)와 같은 힘으로 통일
    poll_gap_s: 0.05                    # 외력 모니터링 폴링 간격(s)
    settle_s: 1.5                       # 넛지 감지 뒤 손을 떼는 시간(s) — 밀기를 알아채면 이만큼 기다린 뒤 로봇 복구 → 이어서 진행(flow._after_nudge).
                                        #   넛지로 풀리는 멈춤 전부(케이블 · 툴 놓침 · 툴 집기 실패 · 로봇 오류 신호 1)에 쓴다 — 손이 닿은 채 이동을 보내면 제어기가 세운다(실기)

f3:                                   # ── f3 절 ── 초안 출처: CELL-02a 용기 치수 측정 §4 (SDD §4.3 예시와 다름)
                                      # 툴 파지 기준: 그리퍼 끝을 세척부 윗면에 닿게 잡는다
                                      #    → 그리퍼 끝 ~ 툴 끝 거리 = 세척부 높이(tool.clean_h_mm).
                                      #    하강 거리·삽입 깊이·닦는 반경을 이 값으로 계산한다(길이를 코드에 적지 않는다).
  soap:                               # 세제 담금 — 접촉 동작이 아니다(수조 안은 비어 있다). 좌표는 cell.stations.SOAP (종류별)
    depth_mm: 40                      # 담그는 깊이 — 티칭한 담금 시작 자세에서 이만큼 내려갔다 올라온다 (CUP·기존 방식)
    hold_s: 0.5                       # 다 내려간 자리에서 머무는 시간 (세제가 묻는 시간)
    vel_mm_s: 80.0                    # 담금·왕복 상하 속도 (× vel_scale) — 빠르면 세제가 튄다
    log_dir: logs/f3                  # (soap 은 힘 로그를 쓰지 않는다 — wipe_* 와 같은 폴더만 맞춰 둔다)
    # ── BOWL 전용 — 수세미를 SOAP 자리로 옮기지 않고, 집은 자리에서 바로 한다 ──
    # move_joint_rel·move_rel 은 vel_scale 로 강제로 깎여서(30°/s·120mm/s 상한) 아무리 값을 올려도 안 빨라졌다.
    #    결정 E17("세척 동작 속도는 vel_scale 예외")과 같은 방식으로 move_periodic(scale=False) 을 쓴다.
    twist_deg: 20.0                   # 좌우 비틀기 각(±, 6번 관절)
    twist_cycles: 3                   # 비틀기 반복 횟수(=move_periodic repeat)
    twist_period_s: 1.0               # 한 왕복(+·-) 주기 — 최고 속도 2π×20/1.0 ≈ 126°/s(로봇 한계 225°/s 안, 첫 시험은 보수적으로)
    updown_mm: 5.0                    # 위아래 왕복 편진폭
    updown_cycles: 2                  # 왕복 반복 횟수(=move_periodic repeat)
    updown_period_s: 0.3              # 한 왕복 주기 — 최고 속도 2π×5/0.3 ≈ 105mm/s(하드웨어 상한 1000mm/s 안, 첫 시험은 보수적으로)
    ramp_s: 0.2                       # Periodic 시작·끝 완만하게(컵과 같은 목적)
    rot_vel_limit_deg_s: 225.0        # 주의: 로봇 회전 속도 한계(AngularVelLimit, 컵과 같은 값) — 넘으면 컨트롤러가 거절
    duration_s: 60                    # soap 동작 전체 시간 상한 — cell.limits.timeout_s(10, 접촉 전용)를 잘못 빌려 쓰던 버그의 수정
                                      #   상승 거리는 여기 없다 — cell.yaml stations.HOME.posx_z_mm 까지 실시간 계산(rise_mm 근삿값 제거)
    tool_split_x_mm: 349.0            # 툴 종류는 잡은 위치(BASE X)로 판정한다: 폭 판정은 그리퍼 힘 버그 때문에 컵솔(목표 5mm)이 헐겁게 잡히면 수세미로
                                      #   오판해 엉뚱한 위치(HOME)로 가서 SAFE_STOP 까지 났다(실기).
                                      #   TOOL_SPONGE 홀더 실측 X ≈ 273 · TOOL_BRUSH 홀더 실측 X ≈ 425 — 둘 사이 중간값.
                                      #   지금 X 가 이보다 크면 컵솔(soap 끝나고 컵 위까지 더 감), 작으면 수세미(HOME 에서 끝)
  wipe_bowl:                          # 그릇 닦기 — 값의 근거는 V-03 실기
                                      #   V-03 실기로 확정한 절차 그대로다: 바닥 찾기 → 순응 → 나선 → 힘제어 1.5 N → 벽면 → 복귀.
                                      #   주의: 벽만 찾지 않는다(결정 E6): 벽 반지름을 그릇·툴 지름으로 계산한다.
                                      #      제한: 결정 E6 ①(바닥도 고정 높이) · ②(벽면 힘제어 없음) 과는 다르다 — 확인 필요.
    tool:                             # 그릇용 수세미 (세척부) — 파지 기준은 위 주석
      clean_h_mm: 35                  # 높이 (실측). 그릇 깊이 45 보다 낮아 그리퍼가 테두리에 닿지 않는다
      d_mm: 90                        # 지름 (CELL-02a 실측)
    # ── 바닥까지 내려가기 (빠르게 → 힘으로 찾기. V-03 실기 방식) ──
    fast_down_mm: 140.0               # 초기자세 HOME(그릇 바로 위)에서 이 길이만큼 빠르게 내려가고, 그 아래는 힘으로 찾는다
                                      #   실측: HOME 에서 수세미 ~ 그릇 바닥 145 mm (실기 5 회 바닥 145.1~146.4)
                                      #   → 135 에서 140 으로: 바닥 찾기가 힘제어라 속도를 못 정한다 → 남은 거리를 약 5 mm 로 줄인다
                                      #   (실기: 144 mm 까지는 2 N 미만 = 아직 안 닿음)
                                      #   바닥 위치는 미리 정하지 않는다 — 바닥은 contact_down 이 찾는다
    # 그릇 닦기는 V-03 실기에서 나선까지 돈 rig_v03(src/cobot_common/test/rig_v03.yaml) 값 그대로다.
    #    다른 값으로 옮긴 판은 나선이 4 번 모두 시작하지 않았다(바닥 6~7 N) → 전부 되돌렸다. 컵과 같게 맞추지 않는다.
    home_vel_deg_s: 40.0              # HOME 관절 이동 속도 (× vel_scale → 12 °/s) — rig_v03 home_vel_deg_s (공용 이동 속도를 쓰지 않는다)
    home_acc_deg_s2: 40.0             #   가속도 (그대로) — rig_v03 home_acc_deg_s2
    fast_vel_mm_s: 220.0              # 빠른 하강 속도 (× vel_scale → 66 mm/s) — 컵과 같은 방식(vel_scale 적용)으로 맞추고 값도 올림
    fast_acc_mm_s2: 440.0             #   가속도 (× vel_scale) — 컵과 같은 배율(2배)로 맞춤. rig_v03 원값(200/200, 가속 미적용)에서 변경
    air_force_max_n: 5.0              # 빠른 하강 뒤 공중 |Fz| 가 이보다 크면 중단(툴 무게·접촉 확인) — rig_v03 air_force_max_n
                                      # 5.0 (E58): 3.0 이었을 때 그릇 1 이 공중 2.99 N(0.01 N 차)이라 정상 흐름이 로봇 오류로 멈출 수 있었다.
                                      #    시작 전 점검값이지 닦기 힘 상한(limit_n 10 N)이 아니다 — 젖은 수세미 무게·센서 흐름 여유. 1회차 로그로 확인.
    find_max_mm: 30.0                 # 바닥을 찾으며 더 내려갈 수 있는 최대 — rig_v03 contact_max_depth_mm
    find_limit_n: 3.0                 # 바닥 판정 힘(공중 기준 대비) — 그릇 전용 3 N. cell.limits.contact_limit_n(2 N)을 쓰지 않는다
                                      #   찾는 법은 rig_v03 그대로: cc.contact_down(3 mm 걸음 · 걸음 끝마다 확인) — 판정 힘만 2 → 3 N
    contact_timeout_s: 40.0           # 바닥 찾기 시간 상한 — rig_v03 설정(cell.limits.timeout_s 10 대신)
    press_vel_mm_s: 20.0              # 순응을 켠 뒤 찾은 높이로 되돌리는 속도 (× vel_scale) — rig_v03
    press_acc_mm_s2: 50.0             #   가속도 (그대로)
    # 곧게 올라오기는 빠른 하강과 같은 값(fast_vel_mm_s · fast_acc_mm_s2)을 쓴다
    # ── 누르는 힘 (벽면 구간에서만 힘제어로 유지한다 — 바닥 나선 중에는 켜지 않는다) ──
    target_force_n: 1.5               # 벽면을 닦는 동안 유지할 누르는 힘 (V-03 실기 확정).
                                      #   공중 기준값(센서 치우침·툴 무게)은 코드가 더해서 명령한다
                                      #   제한: FR-08 은 3~5 N 이지만 수세미는 면이 넓어 1.5 N 로도 눌린다
    limit_n: 10.0                     # 누르는 힘 상한 (공중 기준값 대비) — 넘으면 남은 동작 즉시 정지(stop_now) → 힘 끄기 → 곧게 호출 높이로 → FORCE_LIMIT(E60)
    lateral_max_n: 25.0               # 옆 힘 상한 — 그릇이 밀리거나 툴이 걸린 것
    # ── 바닥 나선 (좌우 비틀기 없음) ──
    bowl_inner_d_mm: 110.0            # 그릇 안지름 → 벽 반지름 = (이 값 − tool.d_mm)/2 + wall_press_mm = 14 mm
                                      #   주의: 수세미가 로봇 순응보다 훨씬 물러 벽에 눌려도 힘이 잡히지 않는다 → 힘이 아니라 크기로 계산(결정 E6)
    wall_press_mm: 4.0                # 벽을 이만큼 밀면서 돈다 — 그릇이 조금 틀어져도 한 바퀴 내내 닿게
    spiral_pitch_mm: 5.0              # 나선이 한 바퀴에 넓어지는 반지름 → 반지름 14 mm 면 약 2.8바퀴
    spiral_time_s: 2.0                # 속도 튜닝(rig_bowl_speed_probe.py): 3.0 → 2.0(2.8바퀴 그대로) — 실기로 2.0 까지 확인(13.5~13.8/14.0 mm 로 돎, 알람 없음).
                                      #   1.7 은 알람 1209(원호 가속도 초과)로 실패, 더 못 줄인다
                                      #   나선은 속도가 아니라 시간으로 지정(중급1 p.69). vel_scale 을 곱하지 않는다(÷0.3 = 10 s 는 실기에서 안 움직였다)
                                      #   반경 대비 회전 수가 과하면(14 mm 에 7바퀴·1.5 s) 시작조차 하지 않는다
    # ── 벽면 회전 (반대 방향 + 좌우 비틀기) ──
    turns: 3                          # 벽면을 도는 바퀴 수 — 5 로 늘려 봤지만 세그먼트가 너무 늘어 오히려 느려져(26.0 s) 3 유지
    wall_arc_deg: 90.0                # 원호 하나의 각도 (90° = 한 바퀴 4개). 작을수록 비틀기가 잦다 — 45 로 줄여 봤지만
                                      #   세그먼트가 배로 늘어 감속이 잦아지고 오히려 느려져서(21.2 s) 90 유지
    wall_approach_vel_mm_s: 60.0      # 벽으로 밀어 붙일 때 속도 — 한 번에 튀어나가면 벽을 세게 박는다
    twist_deg: 10.0                   # 손목 좌우 비틀기 각(±, 6번 축) — 18 → 10. 키우면 문지르는 거리가 늘고 시간도 비례한다
    blend_radius_mm: 3.0              # 원호를 이어 붙이는 거리 — 0 이면 원호마다 멈춰 작업대가 울린다(실기)
    lin_vel_mm_s: 600.0               # 벽면·중심 복귀 이동 속도 (× vel_scale → 180 mm/s) — rig_v03 scrub_lin_vel_mm_s
                                      #   주의: vel_scale 1.0 이면 cell.motion.vel_tcp_max_mm_s(400)에서 잘린다
                                      #   1000 까지 올려 봤지만 시간 변화 없음(병목 아님) — 600 유지
    rot_vel_deg_s: 1600.0             # 속도 튜닝(rig_bowl_speed_probe.py): 400 → 1600(× vel_scale) —
                                      #   실기로 600·800·1000·1200·1600 단계로 확인, 경고음·떨림 전혀 없었다("더 올리면 경고음" 은 실제 600/800 실기를
                                      #   해본 기록이 없었던 잘못된 추정이었음 — SAFE-01 문서 확인).
                                      #   2000 까지 올려 봤지만 1600 과 시간 차이 없어(17.6~17.7 s 정체) 1600 확정 — rig_v03 scrub_rot_vel_deg_s
    lin_acc_mm_s2: 3000.0             # 벽면·중심 복귀 가속도 (그대로) — rig_v03 scrub_lin_acc_mm_s2
    rot_acc_deg_s2: 1000.0            # 손목 회전 가속도 (그대로) — rig_v03 scrub_rot_acc_deg_s2 (4000 은 경고음)
    # ── 감시·기록 ──
    force_every: 4                    # 원호 몇 개마다 힘을 확인할지 — 매번 읽으면 로봇이 서서 작업대가 울린다(실기)
    sample_s: 0.05                    # 나선 도는 동안 힘 기록 주기
    duration_s: 120                   # 닦기 전체 타임아웃 → TIMEOUT
    log_dir: logs/f3                  # 힘 로그 CSV (실행 위치 기준 상대경로)
  wipe_cup:
    tool:                             # 컵용 솔 (세척부)
      clean_h_mm: 95                  # 길이 = 컵 내부 높이 95 (그리퍼 끝 ~ 솔 끝 실측 95 와 일치)
      d_mm: 55                        # 끝 지름 실측 Ø50~60 의 가운데
    # ── 바닥 찾기 (그릇과 달리 컵은 힘으로 찾는다 — 깊고 솔이 단단해 높이가 어긋나면 바로 박힌다) ──
    # ── 컵 위로 가기 — 시작·끝은 초기자세 HOME. HOME 높이에서 옆으로 바로 가면 솔이 컵에 걸린다(실기) ──
    over_cup_up_mm: 40.0              # HOME 에서 먼저 올리는 높이 — 다시 내려오지 않는다, 이 높이가 세척 시작점(cup_hops)
    over_cup_dy_mm: 140.0             # 그다음 BASE y 로 이만큼 → 컵 위(= 세척 시작점, HOME + over_cup_up_mm)
    fast_down_mm: 120.0               # = 원래 80 + over_cup_up_mm 40 — 시작점이 40 mm 높아진 만큼 그대로 더한다.
                                      #   컵 위(= HOME + over_cup_up_mm)에서 이 길이만큼 빠르게 내려가고, 그 아래는 힘으로 찾는다
                                      #   실측(HOME 높이 기준): 컵 위에서 솔 ~ 컵 바닥 90 mm → 10 mm 남기고 80 + 40 = 120. 실기 확인.
                                      #   바닥 위치는 미리 정하지 않는다 — 바닥은 contact_down 이 찾는다
    fast_vel_mm_s: 220.0              # 빠른 하강 · 곧게 올라오기 속도 (× vel_scale → 0.3 에서 66 mm/s) — 그릇·컵 같은 값
    fast_acc_mm_s2: 440.0             #   가속도 (× vel_scale) — 그릇과 같은 배율(2배)
    find_max_mm: 40.0                 # 바닥을 찾으며 더 내려갈 수 있는 최대. 다 내려가도 못 찾으면 오류
    find_limit_n: 5.0                 # 바닥으로 판정하는 힘(시작 대비) — 컵 전용. cell.limits.insert_limit_n(15, F1 팔레트 삽입과 공용)을 쓰지 않는다
                                      #   실기: 15 N 이면 컵이 스펀지 홈에 쑥 눌렸다 · 5 N 이면 5.1~5.7 N 에서 멈추고 컵이 안 움직였다
    # ── 세척 — Move Periodic 한 명령: 위아래 ±stroke 와 6번 조인트 ±spin/2 를 같은 주기로 ──
    #    기준은 TOOL — z = 그리퍼 축 방향 위아래 · rz = 그리퍼 축 회전 = 6번 조인트(두산 정의)
    #    주의: 실기 TOOL rx → 4번 조인트(정의대로) · Virtual 은 rx ↔ rz 를 뒤바꿔 움직였다 → Virtual 결과를 믿지 않는다
    #       BASE rz 는 Virtual 에서 1·4번 조인트를 돌렸다 → 쓰지 않는다. 도는 동안 1·4번 조인트를 감시한다
    lift_mm: 3.0                      # 세척의 가장 낮은 곳 = 바닥 + 이 값 → 세척 범위 바닥 + 3 ~ 33 mm
                                      #   Periodic 은 시작 자리를 가운데로 위아래 똑같이 움직여서, 코드는 바닥 + 3 + stroke 에서 시작한다
    lift_vel_mm_s: 40.0               # 띄우기·마무리 하강 속도 (× vel_scale)
    stroke_mm: 15.0                   # 위아래 편진폭 — 한 번 오르내리면 30 mm = 3 cm
                                      #   실기: 3 mm 는 움직임이 안 보였고 · 4 cm 는 길다 → 3 cm
    spin_deg: 180.0                   # 6번 조인트가 도는 폭 → Periodic 회전 진폭 = 좌우 ±90° (±180 → ±120 → ±90 으로 줄임)
    period_s: 2.6                     # 3.0 → 2.6(하한, 2π×90/2.6 = 217°/s — 로봇 한계 225°/s 턱밑) — 실기 확인(1.0 배속 무정지)
                                      #   한 번 오르내리는 시간 — 실제 값, vel_scale 을 곱하지 않는다(결정 E17)
    rot_vel_limit_deg_s: 225.0        # 주의: 이 로봇의 툴 회전 속도 한계(AngularVelLimit) — 넘으면 컨트롤러가 Periodic 을 거절한다
                                      #   실기 알람 1212: "Rotation Vel(251.327) exceeds AngularVelLimit(225.000)" (주기 3 s)
                                      #   → 코드가 내려가기 전에 계산해서 넘으면 바로 멈춘다
    cycles: 5                         # 오르내리는 횟수 (3 → 5)
    ramp_s: 1.5                       # Periodic 시작·끝을 이 시간에 걸쳐 천천히 — 혹시 다른 조인트가 움직여도 느릴 때 감시가 잡는다
    joint_guard_deg: 1.0              # 도는 동안 1·4번 조인트가 이만큼 넘게 움직이면 즉시 정지 → ROBOT_ERROR (6번 조인트만 돌아야 한다)
    j6_limit_deg: 360.0               # 6번 조인트 한계 (M0609 ±360°)
    j6_margin_deg: 10.0               # 시작 각 ± spin_deg/2 가 한계에서 이만큼은 남아야 돈다 — 안 되면 ROBOT_ERROR
    keep_in_mm: 10.0                  # 왕복 꼭대기(바닥 + lift + 2×stroke)에서도 솔이 이만큼은 컵 안에 남게
                                      #   — 바닥에서는 솔 세척부(95 = 컵 깊이)가 통째로 들어가 있으므로 2 + 40 = 42 mm 올라가도 53 mm 가 남는다
    # ── 감시·기록 ──
    limit_n: 10.0                     # NFR-01 닦기 10 N — 넘으면 남은 동작 즉시 정지(stop_now) → 힘 끄기 → 곧게 호출 높이로 → FORCE_LIMIT(E60)
    lateral_max_n: 25.0               # 옆 힘 상한 — 솔이 컵 벽에 걸리거나 컵이 딸려 올라오는 것
    sample_s: 0.05                    # 왕복 도는 동안 힘 기록 주기
    duration_s: 120                   # 닦기 전체 타임아웃 → TIMEOUT
    log_dir: logs/f3                  # 힘 로그 CSV (실행 위치 기준 상대경로)

flow:                                 # ── flow 절 ── 계획·정책은 DSN-03 에서 확정
  plan:                               # 구역 계획: 위에서부터 차례로, 구역마다 count 개 또는 EMPTY_ZONE 까지
    - {zone: RET_B, kind: BOWL, count: 2}
    - {zone: RET_C, kind: CUP, count: 2}
  rack_order:                         # 칸 배정 순서
    BOWL: [RACK_B1, RACK_B2]
    CUP: [RACK_C1, RACK_C2]           # 컵 2칸
  policy:                             # 실패 정책 (IRD §8): next_zone · isolate · retry:N->isolate · pause
    EMPTY_ZONE: next_zone
    LEFTOVER_REMAIN: isolate          # E52 — 두 번 털어도 잔반이 남으면 사람을 부르지 않는다. 용기를 든 채 곧게 위로 → HOME
                                      #    → 격리 구역에 놓기 → HOME(flow._cleanup_and_isolate) → 다음 용기.
    GRIP_FAIL: pause                  # 털기·담금 중 미끄러짐(f2) · 빈손 감지(f2 weigh)
                                      # 결정 E12 — 격리가 아니라 멈추고 사람이 확인한다.
                                      #    놓쳤다면 용기가 손에 없을 수 있어 격리 동작(옮기기)이 의미가 없고,
                                      #    바닥에 떨어진 용기를 다음 동작이 칠 수 있다.
                                      #    확인 뒤 resume = 그 단계부터 다시 / abort = 그 용기를 접고 다음 용기
                                      #    (IRD §8 · SDD §7 표에 행이 들어가 있다. pick 안의 헛잡음은 F1 이 소화)
    SEAT_FAIL: isolate
    FORCE_LIMIT: "retry:1->isolate"
    TIMEOUT: "retry:1->isolate"
    RACK_JAM: "retry:1->isolate"
    TOOL_FAIL: pause                  # E52 — 홀더에서 못 집으면 용기 잘못이 아니다. 툴은 홀더에 둔 채 그 자리 멈춤
                                      #    → 사람이 홀더 확인 → 넛지(로봇팔 가볍게 밀기 · 또는 재개) → 툴 집기부터 다시(격리 X). 툴 놓침 뒤 다시 집기 실패도 같다.
    TOOL_LOST: pause                  # E37·E62 — 닦는 도중 놓침. 그 자리 정지 → 사람이 홀더에 다시 꽂고 넛지(또는 재개)
                                      #    → 곧게 위로 → "툴 집기" 단계부터(툴 집기 → 세제 → 닦기)
    RACK_FULL: pause
    ROBOT_ERROR: pause
  consumables: {sponge_max_uses: 100, soap_max_dips: 60}   # 수세미·솔 교체 주기 100회(같은 값 · 근거 없이 임의 지정) · 세제 60 = 용기 60개(용기당 1회 · flow.soap_dips 도 +1) · 헹굼 물은 세지 않는다
  weigh_kinds: [BOWL, CUP]            # 무게 단계(move_to WEIGH · leftover_loop)를 하는 종류(FLOW-05 · 결정 E25). 컵도 무게 측정·잔반 버리기(그릇과 같은 흐름) —
                                      #   E25 의 임시 건너뛰기([BOWL])는 WEIGH.CUP 자세·기준값(V-02 컵)이 갖춰져 되돌렸다. 키를 지우면 전부 잰다(예전 동작)
  leftover_max_rounds: 2              # f2.leftover_loop(kind, N) 의 N — 털고 다시 재는 최대 횟수
                                      #   flow 가 넘기는 인자라 flow 절에 둔다 (DSN-03 B8)
  counts:                             # 용기 1개를 처리할 때 기능 함수에 넘기는 횟수 (IRD §8 호출 순서)
    soap_dips: 3                      # f3.soap(count) — 세제 담금
    rinse_dips: 2                     # f2.dip('RINSE', count) — 헹굼 담금
                                      # 2 (V-07 실기 뒤): 담금 1회는 헹굼으로 부족해 보여 2회. 회당 약 6 s
    rinse_shakes: 3                   # f2.shake('RINSE', count) — 물 털기
                                      #   f2.shake('WASTE', …) 의 횟수는 leftover_loop 안에서
                                      #      f2 절의 shake.WASTE.cycles 를 쓴다(여기 아님)
  done_hold_s: 1.0                    # plan 완료 뒤 step='DONE' 을 유지하는 시간.
                                      #   state_pub_hz 주기보다 길어야 HMI 가 완료를 본다
  state_pub_hz: 2.0                   # /flow/state 발행 주기 (IRD §6 = 2 Hz)
                                      #   hmi.state_rate_hz(화면 갱신)와 다른 값이라 이름을 구분했다.
                                      #   hmi.disconnect_after_s 보다 촘촘해야 HMI 가 끊김으로 오판하지 않는다 (DSN-03)
  step_delay_s: 0.0                   # 기능 함수 사이 대기. 실제 운전은 0.0 (뼈대·정책 시험용)
  records_path: records.csv           # 기록 파일 (실행 위치 기준 상대경로)
  use_mock: []                        # 가짜 모듈로 바꿀 기능. 예: [f1, f3] · [f1, f2, f3] 이면 드라이버 없이 돈다.
                                      #   런치 인자 use_mock(= 환경변수 PREWASH_USE_MOCK)이 있으면 그 값이 이 줄을 덮어쓴다
  mock:
    fail_on: []                       # 실패 주입. 예: ["place:SEAT_FAIL", "rack_place:RACK_JAM"]
  preflight:                          # TS-07 — 움직이기 전에 컨트롤러의 툴·TCP 이름을 확인한다. 다르면 시작 거부
                                      #   펜던트에서 TCP 가 풀린 채 시작하면 같은 좌표가 208 mm 아래로 → 그릇 바닥 충돌(실기 사고)
                                      #   이름의 정본은 cell.yaml 머리말(ENV-05). 바뀌면 여기도 같이 — 비우면 그 항목은 검사 안 함
    tool_name: "Tool Weight"
    tcp_name: "GripperDA_v1"
    timeout_s: 3.0                    # 조회 응답 상한(s)
    cable:                            # 시작 전 케이블 장력 확인 — HOME 에서 정지한 채 Fz 를 samples 회(gap_s 간격) 읽어 흔들림(10~90 % 폭 · g)이
      samples: 8                      #   max_spread_g 를 넘으면 경고(멈추지 않음). 약 5 s · 시작할 때 한 번. samples: 0 이면 끈다
      gap_s: 0.7
      max_spread_g: 60                # 제한: 임시값 — HOME 은 저울 자세보다 흔들림이 크다(V-02: HOME 39 g · z158 25 g). 실기 값으로 조정

hmi:                                  # ── hmi 절 ──
  host: 127.0.0.1                     # 접속을 받는 주소. 127.0.0.1 = 이 PC 에서만(기본) / 0.0.0.0 = 같은 망의 태블릿·노트북에서도
                                      #   주의: 0.0.0.0 으로 열면 같은 와이파이의 누구나 시작·중단 버튼을 누를 수 있다 → 태블릿을 쓸 때만, 끝나면 되돌린다
  port: 8000                          # HMI 웹 포트
  venv_dir: ~/venvs/hmi               # 웹 서버 부품(fastapi·uvicorn·websockets)을 설치한 HMI 전용 상자 — hmi_bridge 가 여기서 찾아 붙인다(F4-01)
  state_rate_hz: 2                    # 화면 갱신 주기
  disconnect_after_s: 2.0             # /flow/state 가 이 시간 넘게 없으면 "연결 끊김"
  service_timeout_s: 1.0              # 버튼(/flow/start 등)을 누른 뒤 flow 의 대답을 기다리는 상한 — 넘으면 "flow 응답 없음" (F4-02)
  db_path: prewash.db                 # SQLite 파일 — 워크스페이스 루트 기준(어느 폴더에서 켜도 같은 파일 · f4_hmi.paths) · F4-04 표 5개
  waste_bin_limit_g: 50000            # 버린 잔반 누적이 이 값(50 kg)에 닿으면 HMI 가 일시 정지 → 잔반통 교체 → 교체 완료 → 재개
