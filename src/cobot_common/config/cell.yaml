# cell.yaml — 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋). 주의: 주인 한석형 혼자 고친다. 나머지는 읽기만. (SDD §4.3, IRD §9)
#
# 키 골격은 INF-04 에서 만들었고, 값은 티칭(CELL-04·04b)·검증 결과로 채운다.
#   - 비어 있는 값은 `cobot_common.config.unfilled(cfg)` 로 목록을 볼 수 있고, init() 이 개수를 경고로 알려 준다.
#   - 키 이름 규칙: 소문자 snake_case + 단위 접미사(_mm _deg _n _g _s _pct). ID 는 IRD §2 대문자 그대로.
#   - 좌표는 posj(관절 6개, deg) 또는 posx(x y z rx ry rz, mm·deg — BASE 기준 절대 자세) 중 하나를 키 이름으로 밝힌다.
#   - 양식은 티칭 데이터에 맞췄다(CELL-04 · 결정 E4) — 아래 stations 위의 '자세 적는 법' 을 본다.
#   - 값 옆 주석에 단위·허용 범위·바꾼 이유를 적는다. 예)  safe_z_mm: 150   # V-19 도달 범위 확인
#
# 로봇 컨트롤러 쪽 툴 설정 — 이 파일의 값이 아니라 Dart 에서 등록한다 (ENV-05 · 기록 docs/test_logs/20260922_ENV-05_툴무게등록_황인재.md)
#   TCP `GripperDA_v1`    : X 0 · Y 0 · Z 208 mm · A 0 · B 0 · C 0   ← 이 파일의 posx 좌표는 전부 이 TCP 기준이다. 주의: 바꾸면 좌표가 전부 틀어진다
#   툴 무게 `Tool Weight` : 1.440 kg · 무게중심 (3.98, −3.21, 2.45) mm  ← Dart 자동 측정 2회째(1회째 1.450 kg · (4.65, −4.31, −0.80))
#     그 전(실습 때 값) 1.400 kg · (0.17, 4.85, 10.91) — 무게 판정이 자세마다 60 g 달라 다시 쟀다. 무게 판정 기준값은 이 설정으로 잰다
#   주의: 두 이름을 바꾸지 않는다 — rig_v03·rig_v10 이 이름으로 확인한다. 브링업 뒤 get_current_tool·get_current_tcp 서비스(`robottool` 별칭)로 두 이름이 나오는지 본다
#
# 표기 — E-nn: 팀 결정 번호(docs/meetings/20260919_결정기록_DSN-03.md) · V-nn/INT-nn: 검증 항목(docs/test_logs/) · TS-nn: 트러블슈팅(docs/troubleshooting/)
cell:
  limits:                         # 속도·안전 높이·공통 힘 상한·타임아웃  (SDD §4.3 예시: 60 · 30 · 150 · 10 · 15 · 10)
    vel_free_pct: 60              # 빈손 이동 속도 % (SDD §4.3)
    vel_carry_pct: 30             # 용기·툴을 들고 이동할 때 속도 % (SDD §4.3)
    safe_z_mm: 235                # 접촉 동작 뒤 후퇴 높이(cc.safe_retreat 가 여기까지 올린다) — 이동 경로와 무관(결정 E7: 이동의 안전 높이 경유는 없앴다)
                                  #   주의: SDD §4.3 예시는 150 이지만 그러면 컵을 닦던 솔이 컵 밖으로 안 나온다 → 235.
                                  #   근거(CELL-02a 치수 + 실기 E13): 용기 안 바닥 TCP z = 33 · 그릇 내부 높이 45 → 그릇 입구 78 · 컵 내부 높이 95 → 컵 입구 128
                                  #     그리퍼 끝 → 툴 끝 = 수세미 35 · 솔 95  ⇒ 툴 끝이 입구 위로 나오는 TCP = 그릇 78+35 = 113 · 컵 128+95 = 223
                                  #     223 + 여유 12 = 235. 닦기 접근점(SPONGE_BED_B/C.wash.approach_posx z = 235)과 같은 높이라 서로 맞는다
                                  #   실기에서 눈으로 확인할 것(V-22·V-25): 솔을 쥔 채 이 높이로 올라오면 컵 밖으로 완전히 나오는가
    contact_limit_n: 2.0          # 지금은 닦기 바닥 찾기 전용 — f3_wipe/wipe.py 가 이 값을 직접 읽는다(cc.contact_down 의 limit)
                                  #   2.0 = 결정 E13(실기): 시작 힘 대비 2 N 이 커지면 바닥으로 본다
                                  #   주의: 절대값이 아니라 시작 힘 대비 변화량이다(공중에서도 툴 무게로 1.4~2.4 N 이 읽힌다)
                                  #   NFR-01 의 "탐색 하강 10 N" 은 쓰는 곳이 없어졌다 — 탐색 파지가 고정 자리 파지로 바뀌었다(DSN-04 · E9)
                                  #   안착 놓기는 beds.*.seat.contact_limit_n(15) · 팔레트 삽입은 insert_limit_n(15) 을 따로 쓴다
    insert_limit_n: 15            # 삽입(팔레트·컵 솔) 힘 상한    — NFR-01 "안착 15 N · 삽입 15 N"
    timeout_s: 10                 # 접촉 동작 공통 타임아웃 (SDD §4.3)
    nudge_force_n: 15.0           # 넛지(로봇팔 가볍게 밀기) 판정 힘 — 실기(NEW-02a/b)로 확정 · E48 로 f2.nudge.force_threshold_n 과 같은 값
    nudge_hold_s: 0.15            # 이만큼 유지돼야 진짜 넛지(순간 노이즈 아님) — 같은 실기로 확정(E48 에서 유지)
    nudge_taps: 1                 # 재개에 필요한 밀기 횟수. 1 = 한 번 밀기(두 번은 번거로워 되돌림) — 힘 15 N·유지 0.15 s 는 그대로(E48). 2 로 두면 두 번 쳐야 재개(cc.check_nudge taps)
    nudge_tap_window_s: 2.0       # E48: 첫 밀기 뒤 이 시간 안에 두 번째가 와야 한다(지나면 처음부터)
    nudge_settle_s: 0.5           # halt 뒤 팔이 완전히 멈출 때까지 기다렸다 기준값을 잡는다 — 제한: 임시값 · 실기 값으로 조정
    nudge_poll_s: 0.2             # 힘 읽기 주기 — 너무 빠르면(0.05 s) 로봇 실시간 채널이 하트비트를 못 보내 SAFE_STOP(실기 확인)
    nudge_resume_settle_s: 3.0    # 넛지로 재개된 뒤 로봇 상태가 STANDBY 로 돌아올 때까지 기다리는 최대 시간(폴링) — 고정 시간만 기다리면 MoveIncomplete 가 났다 · 제한: 임시값
    nudge_after_reset_s: 2.0      # 넛지 재개 때 보호정지를 풀었으면 이동 전에 더 기다리는 시간 — 풀린 직후 보낸 이동은 제어기가 곧 세웠다(실기 7056)

  motion:                         # 이동 함수(motion.py) 공용 값 — INF-02. "100 % 기준 속도": 실제 속도 = 기준 × limits.vel_*_pct/100 × 실행 인자 vel_scale
    vel_tcp_max_mm_s: 400         # 직선 이동(movel) 100 % 기준 속도.  (SDD §4.3)  로봇 사양의 최대가 아니라 우리 셀에서 허용하는 최대를 적는다
                                  #   주의: 빈손 60 % = 240 mm/s — 컨트롤러 수동 모드 TCP 상한(≈250 mm/s)에 가깝다.
                                  #      Virtual 에서 300 mm/s 는 잘렸고 275 를 넘으면 이동이 정지했다 → V-22 에서 vel_scale 을 올릴 때 확인한다
    acc_tcp_max_mm_s2: 800        # 직선 이동 100 % 기준 가속도 (SDD §4.3)
    vel_joint_max_deg_s: 100      # 관절 이동(movej) 100 % 기준 속도 (SDD §4.3)
    acc_joint_max_deg_s2: 200     # 관절 이동 100 % 기준 가속도 (SDD §4.3)        (Virtual 시험 값: src/cobot_common/test/config_virtual/cell.yaml)
    vel_joint_fast_max_deg_s: 180 # E36 물 털기 전용 상한("사람이 물기 털 듯 빠르게") — vel_scale 예외 이동(scale=False)만 이 상한을 쓴다.
                                  #   두산 M0609 손목(J4~J6) 관절 한계 225 °/s 아래 · 다른 모든 이동은 위 100 % 기준(100)을 그대로 쓴다
    acc_joint_fast_max_deg_s2: 600 # 물 털기 전용 가속도 상한 — 짧은 왕복은 가속도가 빠르기를 정한다(200 이면 ±25° 3회에 8 s · 실기)
    move_timeout_s: 30            # 이동 1번의 상한 시간(일시정지한 시간은 빼고). 넘으면 정지 명령을 보내고 오류 — V-24 에서 추가

  force:                          # 힘 함수(force.py) 공용 값. 값은 V-03 실기로 확정(시험 기록 docs/test_logs/20260919_V-03_*)
    compliance_stx: [1000, 1000, 200, 100, 100, 100]   # 순응 강성 [x, y, z, rx, ry, rz] N/m · Nm/rad
                                  #   Z 를 가장 물렁하게(200) — 닿을 때 충격을 흡수. 옆·회전도 낮춰(1000·100) 툴이 바닥을 물고
                                  #   비틀릴 때 붙었다 떨어지며 작업대를 흔드는 것(스틱-슬립)을 줄였다. 강의 범위 X·Y·Z 0~20000, 회전 0~400
    contact_step_mm: 3.0          # contact_down 하강 한 단계 — 순응 중이라 닿아도 한 걸음만큼만 눌린다.
                                  #   0.5 mm 는 너무 느리고, 5 mm 이상은 무른 툴에서 한 번에 깊게 눌린다
    contact_vel_mm_s: 20.0        # 접촉 하강 속도 (× vel_scale 0.3 = 6 mm/s)
    contact_acc_mm_s2: 30.0       # 접촉 하강 가속도 — 걸음마다 급정거하면 작업대가 울린다
    retreat_vel_mm_s: 200.0       # safe_retreat 후퇴 속도 (× 0.3 = 60 mm/s, 내려올 때와 같게)
    retreat_acc_mm_s2: 200.0      # safe_retreat 후퇴 가속도
    force_max_n: 15.0             # 힘 함수 인자의 절대 상한 (닦기 상한 10 N 위, 접촉 동작 어디서도 넘지 않는다)
    search_y_period_ratio: 2.0    # periodic_search 의 x:y 주기 비 — 한 선이 아니라 면을 훑게 (V-04 에서 재확인)

  presets:                        # 종류·툴별 파지. 그릇은 외경 114 mm > RG2 최대 폭 110 mm 라 지름 방향 파지 불가(CELL-02a §3) → 벽(테두리)을 위에서 집는다
                                  # grip_zero_mm (결정 E16 · 실측): 빈손으로 꽉 닫아도 드라이버가 읽는 폭이 0 이 아니라 10.5~10.9 mm 다
                                  #   (알루미늄 손가락 사이를 재서 고무 핑거팁 두께가 안 빠진다). 그래서 그릇의 실제 파지 폭 2 mm 는 드라이버 값으로는 도달 불가능한 수다.
                                  #   ㉠안: 영점을 새 키로 두고 폭 판정에서만 빼고 본다 —
                                  #     판정 폭 = cc.grip_width() − grip_zero_mm.  cc.grip_width() 의 반환과 cc.grip() 의 목표 폭은 드라이버 값 그대로(기존 코드 안 깨짐).
                                  #   영점은 파지 힘과 무관하다(V-01 실기). 앞서 "힘에 따라 0.2~0.4 mm" 로 본 것은 타임아웃(3 s)에 걸려 닫는 중간을 읽은 것이었다.
                                  #     상한을 8 s 로 늘리니 20 N·35 N 모두 10.50 으로 같다 → 영점은 하나(10.58) 이고 용기 종류와도 무관하다.
    BOWL:                         # V-01·V-05·V-23 실기로 확정 — 10회씩, 낙하 0
      grip_width_mm: 2.15         # 파지 목표 폭 (영점 뺀 값) — 실측 벽 두께 2 mm 와 일치
      grip_zero_mm: 10.58         # 빈손 영점 — 10회 평균(흔들림 0.20)
      grip_force_n: 20            # NORMAL (집기·이송·놓기)
      hold_force_n: 35            # HOLD   (털기·담금·물 털기) — 제한: "낙하 없는 최소 힘" 은 V-16 에서 더 낮출 수 있다
      width_tol_mm: 0.6           # 폭 판정 허용 오차 — 흔들림 0.30 < tol < 빈손과의 간격/2 (1.00)
      approach_z_mm:              # 접근 높이 — 비어 있음(코드는 접근점 approach_posx 를 쓴다)
    CUP:                          # 반납 자리 집기·놓기는 그릇처럼 테두리 벽을 위에서 집는다(E29 · CELL-05). 홈 C 의 옆면(몸통) 재파지는 아래 CUP_SIDE
                                  # 주의: 결정 E19 — 컵은 물러 RG2 최저 힘 5 N 으로도 눈에 보이게 눌린다(20 N 에서는 안전 스위치 작동).
                                  #   옆면 고정 폭 파지(grip_target_mm 까지만 닫고 멈춤)를 쓸 때 알고 감수하는 한계 3가지 —
                                  #     ① 빈손과 구분이 안 된다(컵 77.90 vs 빈손 77.80) → f1.pick 의 폭 판정·EMPTY_ZONE 을 컵에 쓰지 않는다
                                  #     ② HOLD 가 안 먹는다(목표 폭에 이미 있어 '다시 잡기' 가 없다) → 털기·물 털기는 NORMAL 힘으로 버틴다(V-07)
                                  #     ③ 놓친 것은 무게로만 안다(f2 min_net_g −30 g) → 컵 실측 16~21 g 이라 놓침을 못 잡는 한계가 있다
                                  # 벽 집기로 바꾸면서 옆면 고정 폭(E19)을 끄고 폭 판정(E16)으로 — grip_target_mm 을 빼면 코드가 폭 판정을 쓴다
                                  #   (handling._grip_close · 키로 고른다). 되돌리려면 아래 한 줄을 살린다.
      # grip_target_mm: 76.0      # (E19 옆면 파지 값) — 벽 집기로 바꾼 뒤 안 쓴다
      grip_width_mm: 1.7          # 실기 값: 반납 자리 pick 1.82 · 1.92 · 1.92 / 홈 C 재파지 1.42 → 가운데 1.7 (허용 1.1~2.3)
                                  #   재파지가 얇게 읽히는 건 홈에 앉은 컵의 벽을 조금 다른 높이에서 무는 탓으로 보임 · 빈손이면 11.08 에서 멈춰 0.5 → 판정 밖(그릇은 2.15)
      grip_zero_mm: 10.58         # 그릇과 같다 (빈손 영점은 용기와 무관)
      grip_force_n: 20            # 벽 집기라 그릇과 같은 NORMAL — 옆면 파지 때의 5 N(눌림) 사정은 벽에는 해당 없음
      hold_force_n: 25            # 컵 98 g 잔반 털기에서 35 N 이 테두리를 1.0 mm 눌러 미끄러짐 판정에 걸림(96 g 에서도 0.9) → 덜 누르고 버티는 값으로.
                                  #   컵+잔반 ≤ 130 g 이라 25 N 이면 충분(미끄러지면 30 검토). 벽 집기 96 g 털기는 35 N 에서도 OK 였다(폭 12.4→12.0→11.5)
      width_tol_mm: 0.6           # 그릇과 같게 · 첫 실기 흔들림으로 조정
      approach_z_mm:              # 접근 높이 — 비어 있음(코드는 접근점 approach_posx 를 쓴다)
    CUP_SIDE:                     # 컵 옆면(몸통) 재파지 전용 — 홈 C 에서 다시 잡을 때만(beds.SPONGE_BED_C.regrip_preset)
                                  #   E19 방식: 고정 폭까지만 닫고 폭 판정 없음 · 값은 실기로 70 mm · 10 N(HOLD 도 10 · E19 눌림 방지)
                                  #   그 뒤 f2 의 grip_level('CUP', …) 은 cc.set_grip_preset 덕에 이 프리셋의 힘을 쓴다(gripper.py). release 하면 CUP 으로 돌아간다.
      grip_target_mm: 70.0        # 컵 몸통 실측 77.9 인데 76 을 목표로 주면 손가락이 76 에 닿는 순간 위치로 멈춰 실제 쥐는 힘은
                                  #   "컵이 2 mm 눌리며 되미는 힘"(≈5 N 이하)뿐 — 힘 설정을 20 으로 올려도 달라지지 않는다(실기 75.90 · 이송 중 돌아감).
                                  #   목표를 컵보다 충분히 작게(70) 두면 손가락이 힘 상한에서 멈춘다 → 힘 설정값이 곧 쥐는 힘. 멈춘 폭은 로그(grip 완료)로 본다.
      grip_width_mm: 59.42        # = 70.0 − 영점 10.58 (참고값 — 판정에 쓰지 않는다)
      grip_zero_mm: 10.58
      grip_force_n: 10            # 5 N 으로 재파지하니 팔레트 이송 중 컵이 손가락 사이에서 돌아갔다(적재 OK 였지만 자세 틀어짐) → 10.
                                  #   E19: 5 N 에도 눌림 · 20 N 에서 안전 스위치 → 그 사이 10 으로. 더 필요하면 12.5 → 15 순.
      hold_force_n: 10            # 주의: HOLD = NORMAL — 35 N 이면 몸통이 눌린다. 털기·물 털기는 이 힘으로 버틴다(V-07 · 컵 실측 16~21 g)
    SPONGE:                       # V-08 실기(rig_tool_width --at-holder): TOOL_SPONGE.pick 에서 5회 쥐어 읽은 폭 25.10 (25.10~25.30 · 폭 0.20)
                                  #   손잡이가 단단해 폭 판정(E16)이 된다: 명령 = 영점 + 14.52 − 2×0.6 = 23.9 → 빈손이면 23.9 에서 멈춰 영점 뺀 13.3 → |13.3−14.52| = 1.2 > 0.6 → TOOL_FAIL
