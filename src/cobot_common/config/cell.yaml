        exit_rel_mm: [[0.0, -25.0, 0.0], [0.0, 0.0, 100.0]]                 # 놓은 뒤 이 순서대로 빠져나온다(BASE 기준 상대 이동)
                                                                            #   실기: 꽂은 자리에서 HOME 으로 곧장 가면 그리퍼가 팔레트에 걸린다
                                                                            #   먼저 y −25 로 칸에서 빼고, 그다음 z +100 으로 올린다 — 실기 확인: 이 경로로 걸리지 않는다.
                                                                            #   z 는 스크립트의 200 에서 100 으로 줄였다(200 은 불필요하게 높았다) · 컵 칸(RACK_C*)은 접근점으로 수직 복귀하므로 필요 없다
