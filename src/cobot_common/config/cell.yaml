        via: RACK_B1_VIA                                                    # 접근 전에 거치는 stations 이름 — 손목 +180° 경유점 (f1.rack_place)
        approach_posx: [301.4, 606.2, 407.8, 92.76, 95.0, -172.6]              # 꽂는 칸 바로 위 — 끝점 + (0, 0, +100) (실기)
                                                                            #   ① 대각선으로 곧장 가면 그릇 아래가 팔레트에 걸린다 → 위에서 내려온다
                                                                            #   ② 내려온 뒤 y 로 밀어 넣는 방식은 칸막이 벽에 걸린다(실기로 확인) → 쓰지 않는다
                                                                            #   즉 적재는 칸 바로 위로 가서 z 만 내려 놓는다. 빼는 것만 exit_rel_mm 으로 한다
