  # ───────────────────────────────────────────────────────────── 자세 적는 법 (CELL-04 · 결정 E4)
  # 값의 출처: 티칭 브랜치 seokhyung/20260919-CELL-04-teaching 의 rig_f1.py(5ac87e4) 상수 26개를 고치지 않고 옮긴 것이 바탕이다.
  #   ⚠ = 찍은 값에 확인할 점이 있다 · 옆의 (…) = 티칭 스크립트에서의 이름
  #
  # 자세 1개 = {posj: [...]}  또는  {posx: [...]}  또는  {approach_posx: [...], posx: [...]}
  #   approach_posx = 접근점(끝점 바로 위 — 옆으로 움직여도 되는 높이),  posx = 끝점(놓는·잡는·닿는 자리)
  # 한 자리에 자세가 여러 개면 이름을 붙여 나눈다:
  #   종류별  WASTE: {BOWL: {...}, CUP: {...}}          → cc.move_to('WASTE', True, 'BOWL')         종류마다 자세가 다르다
  #   용도별  TOOL_SPONGE: {pick: {...}, return: {...}} → cc.move_to('TOOL_SPONGE', False, point='pick')
  #   슬롯별  RET_B: {slots: [{...}, {...}]}            → cc.move_to('RET_B', False, point=1/2)     슬롯 번호는 1부터
  # cc.move_to 는 티칭한 자세로 곧장 간다(결정 E7 — 안전 높이를 거치지 않는다). 접근점이 있으면 접근점까지만 가고
  #   끝점까지 남은 높이(mm)를 돌려준다(접근점이 없으면 끝점까지 가고 0). 내려가는 것은 부르는 쪽이 cc.move_rel(0, 0, -남은높이, 'BASE') 나 cc.contact_down 으로.
  #   주의: 경로의 안전은 자세를 부르는 순서와 티칭이 책임진다 — 옆으로 가면 부딪히는 자리에는 접근점을 찍는다.
  #   → 접근점과 끝점은 수직(같은 x·y·방향) 이어야 곧게 내려간 자리가 끝점이 된다(test_config.py 가 검사한다).
