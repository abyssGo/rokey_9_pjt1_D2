        posx:          [364.72, 138.56, 52.18, 71.66, 116.03, 87.31]        #   (잡는 자세 · 손목 B 116° = 옆면에서 몸통을 잡는 기울기). 마지막 f1.regrip_watch_mm 만큼은 힘 감시(0 이면 없음)
