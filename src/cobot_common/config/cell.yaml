                                    #   티칭 스크립트에 있었으나 좌표를 cell.yaml 로 옮기며 빠졌던 자세다.
                                    #   쓰는 곳: f1.rack_place(F1-04) 가 칸 접근점으로 가기 전에 한 번. 그릇 칸에도 같이 쓴다.
