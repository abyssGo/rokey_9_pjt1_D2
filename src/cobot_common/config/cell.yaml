    cup_via:
      posj: [-15.8, 29.9, 73.7, 67.54, 132.5, 152.69]     # 컵 식세기 진입 검증 자세(실기)
    cup_entry_z_mm: 250.0                                # CUP: RINSE 에서 cup_via 로 이동하기 전 수직 상승 높이
