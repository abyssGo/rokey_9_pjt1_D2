        posx:          [329.64, 415.59, 284.03, 90.59, 89.94, -80.58]        # 리허설 뒤 x +3 · C1 과 같이 Z +34.75(249.28 → 284.03 · 기둥에 눌려 기울어짐 방지)
        exit_rel_mm: [[0.0, 0.0, 65.97], [0.0, -65.59, 0.0]]                # Z 350 → Y 350 순서 (350 − 284.03 · 350 − 415.59)
