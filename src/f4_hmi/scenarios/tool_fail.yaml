# 툴 집기 실패 — 두 번째 그릇에서 홀더의 수세미를 집지 못해 멈춤(TOOL_FAIL → pause · E52 9/25). 용기는 스펀지 홈에, 툴은 홀더에 그대로.
# 사람이 홀더를 확인해 고쳐 꽂고 톡(넛지) 또는 재개하면 flow 가 툴 집기부터 다시 한다(RETRY_STEP). 격리는 하지 않는다.
# 실제 flow 의 문구를 그대로 넣었다(handle_failure · TOOL_FAIL). 화요일 예외 ⑦ 의 화면 연습용.
