# 케이블 이상 — 무게를 재는 동안 떨림이 상한(80 g)을 넘어 그 자리에서 멈춤. flow 는 코드 ROBOT_ERROR 에 케이블 안내 문구를 얹어 보내고,
# 사람이 넛지(로봇팔 가볍게 밀기) 또는 재개하면 무게 단계부터 다시 이어 간다(flow.handle_cable_tight · E64 — 다시 재는 무게가 케이블을 본다 · 또 떨리면 같은 멈춤).
# 실제 flow 는 밀기를 알아채면 멈춘 채 '케이블 — 밀기 확인 …' 을, 풀리면 '재개 — 무게를 다시 재며 …' 를 보낸다. 가짜 flow 는 뒤의 문구만 잠깐 보낸다.
# 화면은 message 의 '케이블' 로 로봇 오류가 아닌 '케이블 이상' 멈춤으로 보여 주고, 중단 버튼도 살려 둔다. 시연 예외 ① 의 화면 연습용.
title: 케이블 이상 — 무게 재는 중 떨림 → 넛지 재개
items:
  - kind: BOWL
    zone: RET_B
    rack_slot: RACK_B1
    fail:
      at: WEIGH
      code: ROBOT_ERROR
      action: pause_retry
      message: '케이블 상태를 확인해주세요. 확인 후 로봇팔을 가볍게 밀어 주세요.'
      resume_message: '재개 — 무게를 다시 재며 케이블을 확인합니다'
      resume_s: 2.0
      hold_s: 12.0
  - {kind: BOWL, zone: RET_B, rack_slot: RACK_B2}
  - {kind: CUP,  zone: RET_C, rack_slot: RACK_C1}
  - {kind: CUP,  zone: RET_C, rack_slot: RACK_C2}
